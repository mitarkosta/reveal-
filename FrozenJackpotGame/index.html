<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Frozen Jackpot — v2</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main id="app" class="app">
    <!-- Machine skeleton -->
    <section class="machine" id="machine">
      <!-- reels container -->
      <div id="reels" class="reels" aria-live="polite"></div>

      <!-- controls -->
      <div class="controls" id="controls">
        <button id="spinButton" class="btn primary">SPIN</button>
        <div class="bet">
          <label for="betInput">Bet</label>
          <input id="betInput" type="number" min="1" value="1">
        </div>
      </div>

      <!-- HOLD overlay (managed per reel) -->
      <div id="holdOverlay" class="hold-overlay" aria-hidden="true"></div>

      <!-- final screen (won / game over / results) -->
      <div id="finalScreen" class="final-screen" aria-hidden="true"></div>
    </section>

    <aside id="sidebar" class="sidebar" aria-hidden="true"></aside>

  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
