radial-gradient(

/* =====================================

===================================== */

content:"";

position:absolute;

inset:-100%;

conic-gradient(

from 0deg,

transparent,

rgba(255,215,0,.35),

transparent,

rgba(255,0,50,.35),

);

transform:rotate(0deg);

}


to{

}


}





body::after{

inset:0;

opacity:.25;

goldDust 12s linear infinite;

<script>


/* =====================================
   SETTINGS
===================================== */


const TOTAL_SPINS = 100;

const SESSION_LIMIT = 10;

const HOLD_TIME = 120;





/* =====================================
   GAME STATE
===================================== */


let totalSpins = 0;

let sessionSpins = 0;

let spinning = false;

let holdActive = false;







/* =====================================
   ELEMENTS
===================================== */


const machine = 
document.getElementById("machine");


const spinBtn =
document.getElementById("spinBtn");



const slots = [

document.getElementById("s1"),

document.getElementById("s2"),

document.getElementById("s3")

];



const message =
document.getElementById("message");



const counter =
document.getElementById("counter");



const holdOverlay =
document.getElementById("holdOverlay");



const ice =
document.getElementById("ice");



const timer =
document.getElementById("timer");



const progressBar =
document.getElementById("progressBar");



const final =
document.getElementById("final");







/* =====================================
   SYMBOLS
===================================== */


const symbols=[


"🍒",

"🍋",

"⭐",

"💎",

"🔔",

"7️⃣",

"💰"


];






const messages=[


"Almost...",


"So close...",


"One more try...",


"The jackpot is waiting...",


"Nearly there...",


"Not yet...",


"Maybe next spin...",


"Feeling lucky..."



];









/* =====================================
   SAVE SYSTEM
===================================== */


function saveGame(){


localStorage.setItem(

"FrozenJackpotV3",

JSON.stringify({

totalSpins,

sessionSpins

})

);


}





function loadGame(){


let data =

localStorage.getItem(
"FrozenJackpotV3"
);



if(data){


let game =
JSON.parse(data);



totalSpins =
game.totalSpins || 0;



sessionSpins =
game.sessionSpins || 0;



}



updateCounter();



}





function updateCounter(){


counter.innerHTML =


`
Spin: ${totalSpins} / ${TOTAL_SPINS}
`;


}









/* =====================================
   MOBILE VIBRATION
===================================== */


function vibrate(type){



if(!navigator.vibrate)
return;



if(type==="spin"){


navigator.vibrate(

[40,30,40]

);


}



if(type==="near"){


navigator.vibrate(

[80,40,80]

);


}



if(type==="jackpot"){


navigator.vibrate(

[200,100,300]

);


}



}









/* =====================================
   SPIN BUTTON
===================================== */


spinBtn.onclick=function(){



if(spinning)
return;



if(holdActive)
return;



if(totalSpins>=TOTAL_SPINS)
return;





if(sessionSpins>=SESSION_LIMIT){


startHold();


return;


}





spin();



};









/* =====================================
   MAIN SPIN
===================================== */


function spin(){



spinning=true;



totalSpins++;

sessionSpins++;



updateCounter();

saveGame();



vibrate("spin");



anticipation();



slots.forEach(slot=>{


slot.classList.add("spin");


});





let spinTime=1800;






slots.forEach((slot,index)=>{



setTimeout(()=>{



slot.classList.remove("spin");



slot.innerHTML =

symbols[

Math.floor(

Math.random()*symbols.length

)

];



},



spinTime+(index*400)



);



});







setTimeout(()=>{



finishSpin();



spinning=false;



},3500);




}









/* =====================================
   RESULT
===================================== */


function finishSpin(){



let chance =

Math.random();





if(chance < 0.20){



let near=[


["⭐","⭐","🍋"],


["💎","💎","⭐"],


["7️⃣","7️⃣","🔔"],


["🍒","🍒","💎"],


["💰","💰","⭐"]


];



let combo =

near[

Math.floor(

Math.random()*near.length

)

];




slots[0].innerHTML=combo[0];

slots[1].innerHTML=combo[1];

slots[2].innerHTML=combo[2];



message.innerHTML=

"🔥 SO CLOSE";



vibrate("near");



machine.classList.add("shake");



setTimeout(()=>{

machine.classList.remove("shake");

},400);



}


else{


message.innerHTML=

messages[

Math.floor(

Math.random()*messages.length

)

];



}





if(totalSpins>=TOTAL_SPINS){


completeGame();


return;


}





if(sessionSpins>=SESSION_LIMIT){



setTimeout(()=>{


startHold();


},1000);



}



}









/* =====================================
   ANTICIPATION EVERY 5 SPINS
===================================== */


function anticipation(){



if(totalSpins%5!==0)

return;



let last = slots[2];



last.classList.add(
"fireGlow"
);



message.innerHTML=

"🔥 ONE MORE..."

;



setTimeout(()=>{


last.classList.remove(
"fireGlow"
);



},3000);



}









/* =====================================
   HOLD START
===================================== */


function startHold(){



holdActive=true;


spinBtn.disabled=true;



holdOverlay.style.display=
"flex";



ice.style.display=
"block";



machine.classList.add(
"frozen"
);





let end=

Date.now()

+

HOLD_TIME*1000;





localStorage.setItem(

"holdEnd",

end

);




runTimer(end);



}









/* =====================================
   HOLD TIMER
===================================== */


function runTimer(end){



let timerLoop=setInterval(()=>{



let left=

Math.floor(

(end-Date.now())/1000

);





if(left<=0){


clearInterval(timerLoop);


endHold();


return;


}





let min=

Math.floor(left/60);



let sec=

left%60;



timer.innerHTML=

`

${min<10?"0":""}${min}:

${sec<10?"0":""}${sec}

`;





progressBar.style.width=

(left/HOLD_TIME*100)

+

"%";





},1000);



}









/* =====================================
   END HOLD
===================================== */


function endHold(){



holdActive=false;



sessionSpins=0;



spinBtn.disabled=false;



holdOverlay.style.display=
"none";



ice.style.display=
"none";



machine.classList.remove(
"frozen"
);



localStorage.removeItem(
"holdEnd"
);



saveGame();



message.innerHTML=

"🎰 READY";



}









/* =====================================
   RESTORE HOLD
===================================== */


function restoreHold(){



let saved=

localStorage.getItem(
"holdEnd"
);



if(!saved)

return;



let end=

Number(saved);




if(end>Date.now()){



holdActive=true;



spinBtn.disabled=true;



holdOverlay.style.display=
"flex";



ice.style.display=
"block";



runTimer(end);



}

else{


localStorage.removeItem(
"holdEnd"
);


}



}








/* =====================================
   START
===================================== */


loadGame();

restoreHold();



</script>
<script>


/* =====================================
   AUDIO ENGINE
===================================== */


let audioContext;



function getAudio(){


if(!audioContext){


audioContext =
new AudioContext();


}


return audioContext;


}





function tone(freq,time,type="sine"){



let ctx =
getAudio();



let osc =
ctx.createOscillator();



let gain =
ctx.createGain();




osc.type =
type;



osc.frequency.value =
freq;



gain.gain.value =
0.06;



osc.connect(gain);

gain.connect(
ctx.destination
);



osc.start();



osc.stop(

ctx.currentTime+time

);



}





function spinSound(){



tone(
180,
0.1,
"square"
);



setTimeout(()=>{


tone(
250,
0.1,
"square"
);



},100);



}





function reelStopSound(){


tone(
600,
0.15,
"triangle"
);


}





function freezeSound(){



tone(
900,
0.3,
"sawtooth"
);



setTimeout(()=>{


tone(
450,
0.5,
"sine"
);



},300);



}





function jackpotSound(){



tone(
700,
0.2,
"square"
);



setTimeout(()=>{


tone(
1000,
0.3,
"square"
);


},200);



setTimeout(()=>{


tone(
1400,
0.7,
"triangle"
);


},500);



}









/* =====================================
   SNOW SYSTEM DURING HOLD
===================================== */


function createSnow(){



let container =
document.getElementById(
"snowContainer"
);




for(let i=0;i<80;i++){



let snow =
document.createElement(
"div"
);



snow.className=
"snowflake";



snow.innerHTML="❄";



snow.style.left =

Math.random()*100+"vw";



snow.style.fontSize =

(
10+
Math.random()*30
)

+"px";



snow.style.animationDuration =

(
4+
Math.random()*8
)

+"s";



snow.style.animationDelay =

Math.random()*5+"s";




container.appendChild(
snow
);



}



}







function removeSnow(){



document
.querySelectorAll(
".snowflake"
)

.forEach(
snow=>snow.remove()
);



}









/* =====================================
   FESTIVAL LIGHTS
===================================== */


function festivalLights(){



let light =
document.createElement(
"div"
);



light.className=
"festivalFlash";



document.body.appendChild(
light
);



setTimeout(()=>{


light.remove();


},4000);



}









/* =====================================
   GOLD COINS
===================================== */


function createCoins(){



let container =
document.getElementById(
"coins"
);



for(let i=0;i<80;i++){



let coin =
document.createElement(
"div"
);



coin.className=
"coin";



coin.innerHTML="🪙";



coin.style.left=

Math.random()*100+"vw";



coin.style.fontSize=

(
15+
Math.random()*30
)

+"px";



coin.style.animationDelay=

Math.random()*2+"s";



container.appendChild(
coin
);



setTimeout(()=>{


coin.remove();


},6000);



}



}









/* =====================================
   JACKPOT FLASH
===================================== */


function jackpotFlash(){



let flash =
document.getElementById(
"flash"
);



flash.classList.remove(
"show"
);



void flash.offsetWidth;



flash.classList.add(
"show"
);



}








/* =====================================
   OVERRIDE HOLD
===================================== */


const oldHold =
startHold;



startHold=function(){



oldHold();



freezeSound();



createSnow();



};








const oldEnd =
endHold;



endHold=function(){



removeSnow();



tone(
300,
0.3
);



oldEnd();



};









/* =====================================
   ENHANCE SPIN SOUND
===================================== */


const oldSpin =
spin;



spin=function(){



spinSound();



oldSpin();



};









/* =====================================
   ENHANCE COMPLETE
===================================== */


const oldComplete =
completeGame;



completeGame=function(){



oldComplete();



jackpotSound();



jackpotFlash();



festivalLights();



createCoins();



vibrate(
"jackpot"
);



};






</script>

<script>


/* =====================================
   MOBILE OPTIMIZATION
===================================== */


function mobileOptimization(){



let width =
window.innerWidth;



if(width < 600){



document.body.style.height =
"100dvh";



machine.style.maxWidth =
"95%";



slots.forEach(slot=>{


slot.style.width =
"78px";


slot.style.height =
"78px";


slot.style.fontSize =
"48px";


});



}





}





window.addEventListener(

"resize",

mobileOptimization

);



mobileOptimization();









/* =====================================
   PREVENT DOUBLE TOUCH SPIN
===================================== */


let lastTouch = 0;



spinBtn.addEventListener(

"touchstart",

function(e){



let now =
Date.now();



if(now-lastTouch < 500){


e.preventDefault();


return;


}



lastTouch = now;



},

{
passive:false
}

);









/* =====================================
   START AUDIO AFTER USER ACTION
===================================== */


document.body.addEventListener(

"touchstart",

()=>{


if(audioContext && audioContext.state==="suspended"){


audioContext.resume();


}


},

{
once:true
}

);








/* =====================================
   AUTO CLEAN EFFECTS
===================================== */


function cleanEffects(){



document
.querySelectorAll(

".festivalFlash"

)

.forEach(e=>{


setTimeout(()=>{


e.remove();


},4000);



});




document
.querySelectorAll(

".coin"

)

.forEach(e=>{


setTimeout(()=>{


e.remove();


},6000);



});




document
.querySelectorAll(

".confetti"

)

.forEach(e=>{


setTimeout(()=>{


e.remove();


},5000);



});



}







setInterval(

cleanEffects,

10000

);








/* =====================================
   VISUAL PRESS EFFECT
===================================== */


spinBtn.addEventListener(

"touchstart",

()=>{


spinBtn.style.transform =
"scale(.92)";


}

);




spinBtn.addEventListener(

"touchend",

()=>{


spinBtn.style.transform =
"scale(1)";


}

);









/* =====================================
   FULLSCREEN SUPPORT
===================================== */


function enableFullscreen(){



document.body.addEventListener(

"dblclick",

()=>{


if(document.documentElement.requestFullscreen){


document.documentElement.requestFullscreen();


}


}

);


}



enableFullscreen();









/* =====================================
   RESET AFTER COMPLETE
===================================== */


function resetVisuals(){



machine.classList.remove(
"shake"
);



slots.forEach(slot=>{


slot.classList.remove(
"fireGlow"
);


});



}



window.addEventListener(

"beforeunload",

resetVisuals

);






</script>
