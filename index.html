<!DOCTYPE html>
<html lang="bg">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Almost Jackpot</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{

    height:100vh;

    background:
    radial-gradient(circle,#550000,#050505 75%);

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    overflow:hidden;

}



/* фон */

body::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:
    radial-gradient(gold 1px,transparent 1px);

    background-size:50px 50px;

    opacity:.15;

    animation:bgMove 20s linear infinite;

}


@keyframes bgMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(100px);
    }

}



/* слот машина */


.machine{

    position:relative;

    z-index:2;

    width:95%;

    max-width:650px;

    padding:40px;

    background:
    linear-gradient(#1b1b1b,#050505);

    border:5px solid gold;

    border-radius:35px;

    text-align:center;


    box-shadow:

    0 0 40px gold,
    0 0 100px orange;


    transition:.5s;

}




h1{

    font-size:65px;

    color:#ffd700;


    text-shadow:

    0 0 15px gold,
    0 0 40px orange;


}



.subtitle{

    color:white;

    margin-top:10px;

    letter-spacing:6px;

}




.display{


    margin-top:35px;

    padding:25px;

    background:black;

    border-radius:20px;

    border:3px solid #777;


}



.slots{

    display:flex;

    justify-content:center;

    gap:15px;

}



.slot{


    width:110px;

    height:110px;


    display:flex;

    justify-content:center;

    align-items:center;


    background:#222;

    border:3px solid gold;

    border-radius:15px;


    font-size:60px;


    box-shadow:

    inset 0 0 20px black;


}




.spin{

    animation:spin .12s infinite;

}



@keyframes spin{

    50%{

        transform:translateY(15px);

    }

}





button{


    margin-top:35px;

    padding:20px 60px;

    font-size:28px;

    font-weight:bold;


    border:none;

    border-radius:50px;


    cursor:pointer;


    background:

    linear-gradient(gold,#cc8800);


    box-shadow:

    0 0 30px gold;


}



button:disabled{

    opacity:.4;

}




#message{


    margin-top:30px;

    font-size:32px;

    color:#ffd700;


}



#counter{


    margin-top:15px;

    color:#aaa;

}





/* HOLD SCREEN */


#holdOverlay{


    position:fixed;


    inset:0;


    background:

    rgba(0,0,0,.8);


    display:none;


    justify-content:center;

    align-items:center;


    z-index:20;


    backdrop-filter:blur(8px);


}





#holdBox{


    padding:50px;

    text-align:center;


    border:5px solid gold;

    border-radius:30px;


    background:#111;


    box-shadow:

    0 0 50px gold;


}





#holdTitle{


    font-size:90px;


    color:gold;


    text-shadow:

    0 0 20px gold,
    0 0 50px orange;


    animation:holdGlow 2s infinite alternate;


}



@keyframes holdGlow{


    from{

        opacity:.7;

    }


    to{

        opacity:1;

    }


}




#timer{


    margin-top:20px;

    font-size:40px;

}



.progress{


    width:350px;

    height:25px;


    margin-top:30px;


    background:#333;


    border-radius:20px;


    overflow:hidden;


    border:2px solid gold;


}



#progressBar{


    height:100%;


    width:100%;


    background:

    linear-gradient(90deg,gold,orange);


}




#ice{


    position:fixed;


    inset:0;


    display:none;


    pointer-events:none;


    z-index:15;


    box-shadow:

    inset 0 0 100px 40px rgba(180,230,255,.7);


}



/* финал */


#final{


    margin-top:30px;

    opacity:0;

    transition:2s;

    color:white;

    line-height:1.6;

    font-size:22px;


}



.show{

    opacity:1!important;

}




.confetti{


    position:fixed;


    top:-20px;


    width:12px;

    height:20px;


    animation:fall 3s linear forwards;


}



@keyframes fall{


    to{

        transform:

        translateY(110vh)
        rotate(720deg);

    }

}



</style>

</head>


<body>


<div id="ice"></div>



<div class="machine" id="machine">


<h1>

JACKPOT

</h1>


<div class="subtitle">

VARIABLE REWARD

</div>



<div class="display">


<div class="slots">


<div class="slot" id="s1">🍒</div>

<div class="slot" id="s2">⭐</div>

<div class="slot" id="s3">💎</div>


</div>


</div>



<button id="spinBtn">

🎰 SPIN

</button>


<div id="message">

Almost...

</div>


<div id="counter">

Spin: 0 / 100

</div>


<div id="final"></div>


</div>





<div id="holdOverlay">


<div id="holdBox">


<div id="holdTitle">

HOLD

</div>


<div id="timer">

02:00

</div>



<div class="progress">

<div id="progressBar"></div>

</div>


<p style="margin-top:20px;color:#aaa">

Next spins available soon...

</p>



</div>


</div>


<script>


// =====================
// VARIABLES
// =====================


const TOTAL_SPINS = 100;

const SESSION_LIMIT = 10;

const HOLD_TIME = 120;


let totalSpins = 0;

let sessionSpins = 0;

let spinning = false;



const symbols = [
"🍒",
"🍋",
"⭐",
"💎",
"🔔",
"7️⃣"
];



const messages = [

"Almost...",

"So close...",

"One symbol away",

"Nearly there",

"You almost had it",

"Just missed",

"Maybe next spin",

"The next one could be it",

"Close again",

"Try once more"

];




// ELEMENTS


const s1=document.getElementById("s1");

const s2=document.getElementById("s2");

const s3=document.getElementById("s3");


const button=document.getElementById("spinBtn");


const message=document.getElementById("message");

const counter=document.getElementById("counter");


const holdOverlay=document.getElementById("holdOverlay");

const progressBar=document.getElementById("progressBar");

const timer=document.getElementById("timer");


const final=document.getElementById("final");




// =====================
// SOUND
// =====================


function sound(freq,duration){

let ctx=new AudioContext();

let osc=ctx.createOscillator();

let gain=ctx.createGain();


osc.connect(gain);

gain.connect(ctx.destination);


osc.frequency.value=freq;

gain.gain.value=.05;


osc.start();

osc.stop(ctx.currentTime+duration);

}





// =====================
// SAVE
// =====================


function save(){

localStorage.setItem(
"slotGame",
JSON.stringify({

totalSpins,

sessionSpins

})

);

}




function load(){

let data=
localStorage.getItem("slotGame");


if(data){

let game=JSON.parse(data);


totalSpins=game.totalSpins;

sessionSpins=game.sessionSpins;


counter.innerHTML=
`Spin: ${totalSpins} / ${TOTAL_SPINS}`;

}

}




// =====================
// SPIN
// =====================


button.onclick=function(){


if(spinning) return;


if(totalSpins>=TOTAL_SPINS){

return;

}



if(sessionSpins>=SESSION_LIMIT){

startHold();

return;

}



spin();

};





function spin(){


spinning=true;


totalSpins++;

sessionSpins++;


counter.innerHTML=
`Spin: ${totalSpins} / ${TOTAL_SPINS}`;


save();



sound(200,.15);



let slots=[s1,s2,s3];


slots.forEach(s=>{

s.classList.add("spin");

});



let count=0;


let interval=setInterval(()=>{


slots.forEach(s=>{

s.innerHTML=
symbols[
Math.floor(Math.random()*symbols.length)
];

});


count++;



if(count>=20){


clearInterval(interval);


slots.forEach(s=>{

s.classList.remove("spin");

});


result();


spinning=false;



}



},100);



}






// =====================
// RESULT
// =====================


function result(){


let chance=Math.random();



if(chance<0.15){



let near=[

["⭐","⭐","🍋"],

["💎","💎","⭐"],

["7️⃣","7️⃣","🔔"],

["🍒","🍒","💎"]

];


let combo=
near[
Math.floor(Math.random()*near.length)
];


s1.innerHTML=combo[0];

s2.innerHTML=combo[1];

s3.innerHTML=combo[2];


message.innerHTML=
"🔥 SO CLOSE";


sound(700,.3);



}

else{


message.innerHTML=
messages[
Math.floor(Math.random()*messages.length)
];


}



if(totalSpins>=TOTAL_SPINS){

finish();

}


}






// =====================
// HOLD
// =====================


function startHold(){


holdOverlay.style.display="flex";


button.disabled=true;



let end=

Date.now()+HOLD_TIME*1000;



localStorage.setItem(
"holdEnd",
end
);



runTimer(end);


}




function runTimer(end){



let interval=setInterval(()=>{


let remaining=

Math.floor(
(end-Date.now())/1000
);



if(remaining<=0){


clearInterval(interval);


endHold();


return;

}



let min=
Math.floor(remaining/60);


let sec=
remaining%60;


timer.innerHTML=

`${min<10?"0":""}${min}:${sec<10?"0":""}${sec}`;



progressBar.style.width=

(remaining/HOLD_TIME*100)+"%";



},1000);



}





function endHold(){


holdOverlay.style.display="none";


sessionSpins=0;


button.disabled=false;


localStorage.removeItem("holdEnd");


save();


message.innerHTML=
"🎰 READY";


}






// =====================
// RESTORE HOLD AFTER REFRESH
// =====================


function restoreHold(){


let saved=
localStorage.getItem("holdEnd");


if(!saved) return;


let end=parseInt(saved);


if(end>Date.now()){


holdOverlay.style.display="flex";

button.disabled=true;


runTimer(end);


}

else{

localStorage.removeItem("holdEnd");

}



}






// =====================
// FINAL
// =====================


function finish(){


button.disabled=true;


s1.innerHTML="💰";

s2.innerHTML="⭐";

s3.innerHTML="💎";


message.innerHTML=
"🎉 JACKPOT 🎉";


sound(1000,.8);



confetti();



setTimeout(()=>{


final.classList.add("show");


final.innerHTML=`

<h2 style="color:gold">
But why did you keep trying?
</h2>

<br>

You did not know when the reward would appear.

<br><br>

Every spin created a new expectation.

<br><br>

The uncertainty kept your attention.

<br><br>

<b>
You were not chasing the reward.
</b>

<br><br>

You were chasing the possibility of the reward.

<br><br>

This is variable reinforcement.

`;



},2500);



}






// =====================
// CONFETTI
// =====================


function confetti(){


for(let i=0;i<120;i++){


let c=document.createElement("div");


c.className="confetti";


c.style.left=
Math.random()*100+"vw";


c.style.background=

[
"gold",
"red",
"blue",
"green"
]
[
Math.floor(Math.random()*4)
];


document.body.appendChild(c);



setTimeout(()=>{

c.remove();

},4000);



}


}





// START

load();

restoreHold();



</script>


</body>

</html>
