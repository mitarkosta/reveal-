<script>


// =========================================
// SETTINGS
// =========================================


const TOTAL_SPINS = 100;

const SESSION_LIMIT = 10;

const HOLD_TIME = 120;



// =========================================
// GAME STATE
// =========================================


let totalSpins = 0;

let sessionSpins = 0;

let spinning = false;

let holdActive = false;






// =========================================
// ELEMENTS
// =========================================


const machine =
document.getElementById("machine");


const spinBtn =
document.getElementById("spinBtn");


const slots=[

document.getElementById("s1"),

document.getElementById("s2"),

document.getElementById("s3")

];


const message =
document.getElementById("message");


const counter =
document.getElementById("counter");


const final =
document.getElementById("final");






// =========================================
// SYMBOLS
// =========================================


const symbols=[


"🍒",

"🍋",

"⭐",

"💎",

"🔔",

"7️⃣",

"💰"


];







// =========================================
// MESSAGES
// =========================================


const messages=[


"Almost...",

"So close...",

"One more try...",

"The machine feels lucky...",

"Nearly there...",

"Not yet...",


"Keep going...",


"The jackpot is warming up..."



];









// =========================================
// AUDIO
// =========================================


let audioContext;



function getAudio(){


if(!audioContext)

audioContext=new AudioContext();


return audioContext;


}





function tone(freq,time,type="sine"){


let ctx=getAudio();


let osc=ctx.createOscillator();


let gain=ctx.createGain();



osc.type=type;

osc.frequency.value=freq;


gain.gain.value=.07;



osc.connect(gain);

gain.connect(ctx.destination);



osc.start();


osc.stop(
ctx.currentTime+time
);


}






function spinSound(){


tone(
180,
.12,
"square"
);


setTimeout(()=>{

tone(
240,
.12,
"square"
);

},120);


}





function reelStopSound(){


tone(
600,
.15,
"triangle"
);


}





function freezeSound(){


tone(
900,
.3,
"sawtooth"
);


setTimeout(()=>{


tone(
450,
.5,
"sine"
);


},300);


}









// =========================================
// SAVE
// =========================================


function saveGame(){


localStorage.setItem(

"FrozenJackpotV4",

JSON.stringify({

totalSpins,

sessionSpins

})

);


}







function loadGame(){


let data=

localStorage.getItem(
"FrozenJackpotV4"
);



if(data){


let game=

JSON.parse(data);



totalSpins=

game.totalSpins || 0;



sessionSpins=

game.sessionSpins || 0;



}



updateCounter();


}






function updateCounter(){


counter.innerHTML=

`
Spin: ${totalSpins} / ${TOTAL_SPINS}
`;


}









// =========================================
// VIBRATION
// =========================================


function phoneVibrate(){



if(navigator.vibrate){


navigator.vibrate(50);


}



machine.classList.add(
"vibrate"
);



setTimeout(()=>{


machine.classList.remove(
"vibrate"
);


},200);



}









// =========================================
// BUTTON
// =========================================


spinBtn.onclick=function(){


if(spinning)

return;


if(holdActive)

return;



if(totalSpins>=TOTAL_SPINS)

return;



if(sessionSpins>=SESSION_LIMIT){


startHold();


return;


}



startSpin();


};









// =========================================
// MAIN SPIN
// =========================================


function startSpin(){



spinning=true;



totalSpins++;

sessionSpins++;





saveGame();

updateCounter();



spinSound();


phoneVibrate();





// включва blur въртенето


slots.forEach(slot=>{


slot.classList.add(
"spinning"
);


});





// 🔥 АНТИСИПЕЙШЪН ПО ВРЕМЕ НА 5-ТОТО ВЪРТЕНЕ

if(totalSpins % 5 === 0){


setTimeout(()=>{


slots[2].classList.add(
"lastReelFire"
);



message.innerHTML=

"🔥 JACKPOT IS CLOSE...";



},600);



}







// спиране на ролките една по една


slots.forEach((slot,index)=>{


setTimeout(()=>{



slot.classList.remove(
"spinning"
);



slot.classList.add(
"stopGlow"
);



slot.innerHTML=

symbols[

Math.floor(
Math.random()*symbols.length
)

];



reelStopSound();





setTimeout(()=>{


slot.classList.remove(
"stopGlow"
);



},700);



},900+(index*550));



});









setTimeout(()=>{


slots[2].classList.remove(
"lastReelFire"
);



finishSpin();



spinning=false;



},3000);



}









// =========================================
// RESULT
// =========================================


function finishSpin(){



let chance=Math.random();



if(chance<0.20){


let near=[


["⭐","⭐","🍋"],

["💎","💎","⭐"],

["7️⃣","7️⃣","🔔"],

["🍒","🍒","💎"],

["💰","💰","⭐"]


];



let combo=

near[
Math.floor(
Math.random()*near.length
)
];



slots[0].innerHTML=combo[0];

slots[1].innerHTML=combo[1];

slots[2].innerHTML=combo[2];



message.innerHTML=

"🔥 SO CLOSE";



machine.classList.add(
"shake"
);



setTimeout(()=>{


machine.classList.remove(
"shake"
);


},400);



}

else{


message.innerHTML=

messages[

Math.floor(
Math.random()*messages.length
)

];



}





if(sessionSpins>=SESSION_LIMIT){


setTimeout(()=>{


startHold();


},1000);



}



if(totalSpins>=TOTAL_SPINS){


completeGame();


}



}





// =========================================
// INIT
// =========================================


loadGame();



</script>

}




function tone(freq,time,type="sine"){

let ctx=getAudio();


let osc =
ctx.createOscillator();


let gain =
ctx.createGain();


osc.type=type;

osc.frequency.value=freq;


gain.gain.value=.07;


osc.connect(gain);

gain.connect(
ctx.destination
);


osc.start();


osc.stop(
ctx.currentTime+time
);

}
