<!-- =========================================
 PART 1 / CLEAN OPTIMIZATION BASE
 ПОСТАВИ ПРЕДИ СТАРИТЕ SCRIPT ЧАСТИ
========================================= -->


<style>


/* ==============================
 PERFORMANCE OPTIMIZATION
============================== */


.slot,
.machine,
#holdOverlay,
#iceFace,
.coin,
.iceParticle{

will-change:transform,opacity,filter;

}





/* ==============================
 VISIBLE ICE FACE HOLDER
============================== */


#iceFace{


position:fixed;

inset:0;

z-index:300;


display:flex;

justify-content:center;

align-items:center;


pointer-events:none;


opacity:0;


transition:opacity 3s ease;


}



#iceFace.show{


opacity:1;


}




.faceImage{


width:280px;

height:280px;


border-radius:50%;


background:


radial-gradient(

circle,

rgba(255,255,255,.95),

rgba(180,230,255,.5),

transparent 70%

);



box-shadow:


0 0 50px white,

0 0 120px cyan,

0 0 200px blue;



filter:

blur(1px);



animation:

frozenFacePulse 4s infinite alternate;



}





@keyframes frozenFacePulse{


from{


transform:scale(.95);


opacity:.6;


}



to{


transform:scale(1.08);


opacity:1;


}



}






/* ==============================
 LAST REEL FIRE OPTIMIZED
============================== */


.lastReelFire{


border-color:red!important;


animation:


fireSpin .35s infinite alternate;


}




@keyframes fireSpin{


from{


box-shadow:

0 0 20px red,

0 0 50px orange;


}



to{


box-shadow:

0 0 80px yellow,

0 0 160px red;


}



}







/* ==============================
 JACKPOT COIN SYSTEM
============================== */


.jackpotCoin{


position:fixed;


top:-50px;


z-index:500;


font-size:35px;


pointer-events:none;



animation:

coinExplosion 5s linear forwards;



}





@keyframes coinExplosion{


0%{


transform:

translateY(-50px)

rotate(0deg);


opacity:1;


}



100%{


transform:

translateY(110vh)

rotate(720deg);


opacity:0;


}



}




</style>





<script>


// =================================
// OPTIMIZED GLOBAL STATE
// =================================



window.FrozenJackpot={

version:"V5",

locked:false,

hold:false,

jackpot:false

};





// =================================
// REMOVE DUPLICATE ANIMATION LOAD
// =================================


document.querySelectorAll(
"script[data-old]"
)
.forEach(s=>s.remove());






// =================================
// SAFE ELEMENT CACHE
// =================================


const FJ={};


FJ.machine=
document.getElementById(
"machine"
);



FJ.slots=[

document.getElementById("s1"),

document.getElementById("s2"),

document.getElementById("s3")

];



FJ.button=
document.getElementById(
"spinBtn"
);



FJ.message=
document.getElementById(
"message"
);



FJ.counter=
document.getElementById(
"counter"
);



FJ.hold=
document.getElementById(
"holdOverlay"
);






// =================================
// OPTIMIZED SYMBOL LIST
// =================================


FJ.symbols=[


"🍒",

"🍋",

"⭐",

"💎",

"🔔",

"7️⃣",

"💰"


];







// =================================
// MOBILE PERFORMANCE
// =================================


function optimizeDevice(){


document.documentElement.style.touchAction=
"manipulation";



if(window.innerWidth<600){


FJ.slots.forEach(s=>{


s.style.willChange=
"transform";


});


}



}



window.addEventListener(
"resize",
optimizeDevice
);


optimizeDevice();





console.log(
"Frozen Jackpot V5 Base Loaded"
);



</script>
<!-- =========================================
 PART 2 / OPTIMIZED SPIN ENGINE
 ПОСТАВИ СЛЕД PART 1
========================================= -->


<script>


// =================================
// SPIN SETTINGS
// =================================


const FJ_SPIN_TIME = 3000;

const FJ_REEL_DELAY = 550;






// =================================
// NEW SPIN ENGINE
// =================================



function optimizedSpin(){



if(FrozenJackpot.locked)

return;



if(FrozenJackpot.hold)

return;





FrozenJackpot.locked=true;



spinning=true;



totalSpins++;

sessionSpins++;





updateCounter();

saveGame();



spinSound();


phoneVibrate();






// ===============================
// START REELS
// ===============================



FJ.slots.forEach(slot=>{


slot.classList.add(
"spinning"
);


});









// ===============================
// 5TH SPIN ANTICIPATION
// ПО ВРЕМЕ НА ВЪРТЕНЕТО
// ===============================



if(totalSpins % 5 === 0){



setTimeout(()=>{



let fireReel=
FJ.slots[2];



fireReel.classList.add(
"lastReelFire"
);



FJ.message.innerHTML=

"🔥 JACKPOT IS CLOSE...";




},700);



}









// ===============================
// STOP REELS
// ===============================



FJ.slots.forEach((slot,index)=>{



setTimeout(()=>{



slot.classList.remove(
"spinning"
);



slot.classList.add(
"stopGlow"
);





slot.innerHTML=

FJ.symbols[

Math.floor(

Math.random()*

FJ.symbols.length

)

];






reelStopSound();







setTimeout(()=>{


slot.classList.remove(
"stopGlow"
);



},600);






},900+(index*FJ_REEL_DELAY));



});









// ===============================
// FINISH
// ===============================



setTimeout(()=>{



FJ.slots.forEach(slot=>{


slot.classList.remove(
"spinning"
);


});





FJ.slots[2].classList.remove(
"lastReelFire"
);





finishSpin();



spinning=false;



FrozenJackpot.locked=false;



},FJ_SPIN_TIME);





}








// =================================
// REPLACE BUTTON
// =================================



spinBtn.onclick=function(){



if(totalSpins>=TOTAL_SPINS)

return;



if(sessionSpins>=SESSION_LIMIT){


startHold();


return;


}



optimizedSpin();



};









console.log(
"Frozen Jackpot Spin Engine Loaded"
);



</script>
