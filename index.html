<!DOCTYPE html>
<html lang="bg">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frozen Jackpot</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}



body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;


font-family:Arial, sans-serif;



background:

radial-gradient(
circle,
#700000,
#080808 80%
);



color:white;

}





/* Златни частици на фона */


body::before{


content:"";


position:absolute;


inset:0;


background-image:


radial-gradient(
gold 1px,
transparent 1px
);



background-size:40px 40px;


opacity:.18;


animation:

backgroundMove 20s linear infinite;


}





@keyframes backgroundMove{


from{

transform:translateY(0);

}


to{

transform:translateY(100px);

}


}






/* =========================
   SLOT MACHINE
========================= */



.machine{


position:relative;


z-index:3;



width:95%;

max-width:700px;



padding:45px;



background:


linear-gradient(
145deg,
#222,
#050505
);



border:5px solid gold;



border-radius:40px;



text-align:center;



box-shadow:



0 0 40px gold,

0 0 120px orange;



transition:1.5s;


}





.machine.frozen{


filter:

blur(3px)
brightness(.5)
saturate(.3);



transform:scale(.98);



}




h1{


font-size:70px;



font-weight:900;



color:#ffd700;



text-shadow:


0 0 20px gold,

0 0 60px orange;


}





.subtitle{


margin-top:10px;


font-size:18px;


letter-spacing:8px;


color:#ddd;


}






.display{


margin-top:40px;



padding:30px;



background:#000;



border-radius:25px;



border:3px solid #777;



box-shadow:


inset 0 0 40px black;


}







.slots{


display:flex;


justify-content:center;


gap:20px;


}




.slot{


height:120px;


width:120px;



display:flex;


align-items:center;


justify-content:center;



font-size:70px;



background:

linear-gradient(
145deg,
#333,
#111
);



border:

4px solid gold;



border-radius:20px;



box-shadow:


inset 0 0 25px black,

0 0 20px rgba(255,215,0,.5);



}




.spin{


animation:

spinMove .12s infinite;


}




@keyframes spinMove{


50%{

transform:

translateY(20px);


}

}





button{


margin-top:40px;



padding:22px 70px;



font-size:30px;



font-weight:bold;



border:none;



border-radius:60px;



cursor:pointer;



background:


linear-gradient(
gold,
#d88900
);



box-shadow:


0 0 35px gold;


}




button:disabled{


opacity:.4;


}




#message{


margin-top:30px;


font-size:35px;


color:gold;


text-shadow:

0 0 15px gold;


}




#counter{


margin-top:15px;


color:#aaa;


font-size:20px;


}







/* =========================
   ICE LAYER
========================= */


#ice{


display:none;


position:fixed;


z-index:10;


inset:0;


pointer-events:none;



background:


radial-gradient(

circle,

transparent 45%,

rgba(150,230,255,.35) 75%,

rgba(255,255,255,.85)

);



box-shadow:



inset 0 0 120px 60px #b9efff;



animation:


icePulse 3s infinite alternate;



}





@keyframes icePulse{


from{

opacity:.5;

}



to{

opacity:1;

}


}






#ice::before{


content:"";


position:absolute;


inset:0;



background:


linear-gradient(

120deg,

transparent,

rgba(255,255,255,.7),

transparent

);



animation:


iceMove 5s infinite;


}



@keyframes iceMove{


from{

transform:translateX(-100%);

}


to{

transform:translateX(100%);

}


}






#ice::after{


content:


"❄  ❄   ❄    ❄     ❄";



position:absolute;


top:-50px;


left:0;



width:100%;



font-size:60px;


color:white;



opacity:.5;



letter-spacing:80px;



animation:


snowFall 8s linear infinite;


}




@keyframes snowFall{


to{

transform:

translateY(120vh);


}


}
/* =========================
   HOLD FREEZE SCREEN
========================= */


#holdOverlay{


position:fixed;


inset:0;



display:none;



justify-content:center;


align-items:center;



z-index:20;



background:

rgba(0,0,0,.85);



backdrop-filter:

blur(12px);


}





#holdBox{


position:relative;



width:500px;



padding:55px;



text-align:center;



background:


linear-gradient(

145deg,

#222,

#050505

);



border:

5px solid gold;



border-radius:40px;



overflow:hidden;



box-shadow:


0 0 50px gold,

0 0 100px cyan;



animation:


holdBoxFreeze 2s infinite alternate;



}







@keyframes holdBoxFreeze{


from{


box-shadow:


0 0 40px gold,

0 0 70px cyan;



}



to{


box-shadow:


0 0 80px white,

0 0 140px #80eaff;



}


}







/* ледена рамка около HOLD */


#holdBox::before{


content:"";


position:absolute;


inset:-10px;



border-radius:50px;



background:


linear-gradient(

45deg,

transparent,

#bff7ff,

transparent

);



animation:


iceBorder 4s linear infinite;


opacity:.7;


}



@keyframes iceBorder{


from{

transform:rotate(0deg);

}



to{

transform:rotate(360deg);

}



}








/* =========================
   HOLD TITLE
========================= */



#holdTitle{


position:relative;



font-size:100px;



font-weight:900;



letter-spacing:15px;



background:


linear-gradient(

180deg,

white,

#fff,

gold,

#7fe9ff

);



-webkit-background-clip:text;



color:transparent;



text-shadow:


0 0 10px white,


0 0 30px cyan,


0 0 60px gold;



animation:


freezeTitle 2s infinite alternate;



}




@keyframes freezeTitle{


from{


filter:

brightness(.8);



transform:

scale(1);


}



to{


filter:

brightness(1.5);



transform:

scale(1.04);



}


}






/* движещ се лед върху HOLD */


#holdTitle::after{


content:"";


position:absolute;



top:0;


left:-120%;



width:60%;



height:100%;



background:


linear-gradient(

90deg,

transparent,

rgba(255,255,255,.9),

transparent

);



animation:


titleIceSweep 3s infinite;



}



@keyframes titleIceSweep{


to{


left:160%;


}



}






/* =========================
   TIMER
========================= */


#timer{


margin-top:30px;



font-size:50px;



font-weight:bold;



color:white;



text-shadow:


0 0 20px cyan;



}







/* =========================
   PROGRESS BAR
========================= */



.progress{


margin:35px auto 0;



height:30px;



width:380px;



background:#111;



border-radius:30px;



border:3px solid gold;



overflow:hidden;



box-shadow:


0 0 20px gold;



}




#progressBar{


height:100%;



width:100%;



background:


linear-gradient(

90deg,

gold,

orange,

white

);



transition:

width 1s linear;



}







/* =========================
   HOLD TEXT
========================= */


.holdText{


margin-top:25px;



color:#aaa;



font-size:18px;



letter-spacing:3px;



}








/* =========================
   FINAL MESSAGE
========================= */


#final{


margin-top:40px;



opacity:0;



transition:

2s;



font-size:24px;



line-height:1.7;



color:white;


}



#final.show{


opacity:1;



}






/* =========================
   CONFETTI
========================= */



.confetti{


position:fixed;



top:-20px;



width:15px;



height:25px;



z-index:50;



animation:


fall 4s linear forwards;



}



@keyframes fall{


to{


transform:


translateY(110vh)

rotate(720deg);



}



}








/* =========================
   ICE CRYSTALS
========================= */



.crystal{


position:absolute;



color:white;



font-size:30px;



opacity:.8;



animation:


crystalPulse 2s infinite alternate;



}



@keyframes crystalPulse{


from{

opacity:.4;

}



to{

opacity:1;

}


}<script>


// ===================================
// SETTINGS
// ===================================


const TOTAL_SPINS = 100;

const SESSION_LIMIT = 10;

const HOLD_SECONDS = 120;



// ===================================
// GAME STATE
// ===================================


let totalSpins = 0;

let sessionSpins = 0;

let spinning = false;

let holdActive = false;



// ===================================
// ELEMENTS
// ===================================


const machine =
document.getElementById("machine");


const spinBtn =
document.getElementById("spinBtn");


const slots = [

document.getElementById("s1"),

document.getElementById("s2"),

document.getElementById("s3")

];


const message =
document.getElementById("message");


const counter =
document.getElementById("counter");


const ice =
document.getElementById("ice");


const holdOverlay =
document.getElementById("holdOverlay");


const timer =
document.getElementById("timer");


const progressBar =
document.getElementById("progressBar");


const final =
document.getElementById("final");




// ===================================
// SYMBOLS
// ===================================


const symbols = [

"🍒",
"🍋",
"⭐",
"💎",
"🔔",
"7️⃣"

];



const texts=[

"Almost...",

"So close...",

"One symbol away",

"Nearly there",

"Not yet",

"Try again",

"The jackpot is waiting",

"Almost perfect"

];






// ===================================
// SOUND ENGINE
// ===================================


function sound(freq,time){


let ctx =
new AudioContext();


let osc =
ctx.createOscillator();


let gain =
ctx.createGain();



osc.connect(gain);

gain.connect(
ctx.destination
);



osc.frequency.value=freq;


gain.gain.value=.06;



osc.start();



osc.stop(
ctx.currentTime+time
);



}





function freezeSound(){


sound(900,.3);


setTimeout(()=>{

sound(500,.5);

},200);



}





function meltSound(){


sound(200,.3);


setTimeout(()=>{

sound(800,.6);

},300);



}






// ===================================
// SAVE / LOAD
// ===================================


function saveGame(){


localStorage.setItem(

"FrozenCasino",

JSON.stringify({

totalSpins,

sessionSpins

})

);



}





function loadGame(){


let data =

localStorage.getItem(
"FrozenCasino"
);



if(data){


let game =
JSON.parse(data);



totalSpins =
game.totalSpins || 0;


sessionSpins =
game.sessionSpins || 0;


}



updateCounter();



}





function updateCounter(){


counter.innerHTML =

`
Spin: ${totalSpins} / ${TOTAL_SPINS}
`;

}






// ===================================
// SPIN BUTTON
// ===================================


spinBtn.onclick=function(){


if(spinning)
return;


if(holdActive)
return;



if(totalSpins>=TOTAL_SPINS)
return;



if(sessionSpins>=SESSION_LIMIT){


startHold();


return;


}



spin();


};








// ===================================
// SPIN
// ===================================


function spin(){


spinning=true;



totalSpins++;

sessionSpins++;



updateCounter();


saveGame();



sound(200,.15);



slots.forEach(slot=>{

slot.classList.add("spin");

});



let counterSpin=0;



let animation=setInterval(()=>{


slots.forEach(slot=>{


slot.innerHTML =

symbols[

Math.floor(
Math.random()*symbols.length
)

];


});



counterSpin++;



if(counterSpin>=20){


clearInterval(animation);



slots.forEach(slot=>{

slot.classList.remove("spin");

});



result();



spinning=false;



}



},100);



}









// ===================================
// RESULT
// ===================================


function result(){



let chance=Math.random();



if(chance<0.15){



let near=[


["⭐","⭐","🍋"],

["💎","💎","⭐"],

["7️⃣","7️⃣","🔔"],

["🍒","🍒","💎"]


];



let combo =

near[
Math.floor(
Math.random()*near.length
)
];



slots[0].innerHTML=combo[0];

slots[1].innerHTML=combo[1];

slots[2].innerHTML=combo[2];



message.innerHTML=

"🔥 SO CLOSE";



sound(700,.3);



}

else{


message.innerHTML=

texts[
Math.floor(
Math.random()*texts.length
)
];


}





if(totalSpins>=TOTAL_SPINS){


finish();


}



}








// ===================================
// HOLD MODE
// ===================================


function startHold(){



holdActive=true;


spinBtn.disabled=true;



holdOverlay.style.display="flex";



ice.style.display="block";



machine.classList.add("frozen");



freezeSound();





let end =

Date.now()

+

HOLD_SECONDS*1000;




localStorage.setItem(

"holdTime",

end

);



holdTimer(end);



}







function holdTimer(end){



let interval=setInterval(()=>{



let remaining =

Math.floor(

(end-Date.now())
/1000

);



if(remaining<=0){


clearInterval(interval);


endHold();


return;


}





let min=

Math.floor(
remaining/60
);



let sec=

remaining%60;



timer.innerHTML=

`

${min<10?"0":""}${min}:

${sec<10?"0":""}${sec}

`;





progressBar.style.width=

(

remaining/HOLD_SECONDS*100

)

+"%";





},1000);



}







function endHold(){



holdActive=false;



sessionSpins=0;



spinBtn.disabled=false;



holdOverlay.style.display="none";



ice.style.display="none";



machine.classList.remove("frozen");



meltSound();



localStorage.removeItem(
"holdTime"
);



saveGame();



message.innerHTML=

"🎰 READY";



}








// ===================================
// RESTORE HOLD
// ===================================


function restoreHold(){



let saved =

localStorage.getItem(
"holdTime"
);



if(!saved)
return;



let end=

Number(saved);



if(end>Date.now()){



holdActive=true;


spinBtn.disabled=true;



holdOverlay.style.display="flex";


ice.style.display="block";


machine.classList.add("frozen");



holdTimer(end);



}

else{


localStorage.removeItem(
"holdTime"
);


}



}








// ===================================
// FINAL JACKPOT
// ===================================


function finish(){



spinBtn.disabled=true;



slots[0].innerHTML="💰";

slots[1].innerHTML="⭐";

slots[2].innerHTML="💎";



message.innerHTML=

"🎉 JACKPOT 🎉";



sound(1200,1);



confetti();



setTimeout(()=>{


final.classList.add("show");



final.innerHTML=`

<h2 style="color:gold">

But why did you keep trying?

</h2>


<br>


You didn't know when the reward would appear.

<br><br>


Every spin created expectation.

<br><br>


The uncertainty kept your attention.

<br><br>


<b>

You were chasing the possibility.

</b>


<br><br>


This is variable reinforcement.

`;



},2500);



}







// ===================================
// CONFETTI
// ===================================


function confetti(){



for(let i=0;i<150;i++){


let c=document.createElement("div");


c.className="confetti";


c.style.left=

Math.random()*100+"vw";



c.style.background=

[

"gold",

"red",

"blue",

"white"

]

[

Math.floor(
Math.random()*4
)

];



document.body.appendChild(c);



setTimeout(()=>{


c.remove();


},4000);



}



}






// ===================================
// START
// ===================================


loadGame();

restoreHold();



</script>
