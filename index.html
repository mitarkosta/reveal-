)

];

<!-- =========================================
 PART 2 / CLEAN SPIN ENGINE V6
 ПОСТАВИ СЛЕД PART 1
========================================= -->

<script>


// =================================
// SPIN ENGINE SETTINGS
// =================================


const FJ_CONFIG = {

    spinTime:3000,

    reelDelay:600,

    jackpotChance:0.08,

    closeJackpotSpin:5

};




// =================================
// CLEAN SPIN STATE
// =================================


window.FJSpin = {

    active:false,

    lastSpin:false,

    result:[]

};




// =================================
// SYMBOL DATABASE
// =================================


const FJ_SYMBOLS=[

    "🍒",
    "🍋",
    "⭐",
    "🔔",
    "💎",
    "7️⃣",
    "💰"

];




// =================================
// RANDOM SYMBOL
// =================================


function fjRandomSymbol(){


return FJ_SYMBOLS[

Math.floor(

Math.random()*FJ_SYMBOLS.length

)

];


}





// =================================
// JACKPOT CHANCE SYSTEM
// =================================


function fjGenerateResult(){


let result=[];



// шанс за специална победа


if(

Math.random()

<

FJ_CONFIG.jackpotChance

){



result=[

"💰",

"💰",

"💰"

];



}

else{


result=[

fjRandomSymbol(),

fjRandomSymbol(),

fjRandomSymbol()

];


}



return result;


}







// =================================
// SPIN START
// =================================


function fjStartSpin(){



if(FJSpin.active)

return;



if(FrozenJackpot.hold)

return;





FJSpin.active=true;



FrozenJackpot.locked=true;



totalSpins++;

sessionSpins++;





updateCounter();

saveGame();






if(typeof spinSound==="function")

spinSound();





if(typeof phoneVibrate==="function")

phoneVibrate();







let result=

fjGenerateResult();




FJSpin.result=result;








// визуално въртене



FJ.slots.forEach((slot,index)=>{



slot.classList.add(
"spinning"
);




});








// близък джакпот ефект


if(

totalSpins %

FJ_CONFIG.closeJackpotSpin

===0

){


setTimeout(()=>{


FJ.slots[2]

.classList.add(
"lastReelFire"
);



FJ.message.innerHTML=

"🔥 JACKPOT NEAR 🔥";



},700);



}









// спиране на барабаните


FJ.slots.forEach((slot,index)=>{



setTimeout(()=>{



slot.classList.remove(
"spinning"
);



slot.innerHTML=

result[index];





slot.classList.add(
"stopGlow"
);






if(typeof reelStopSound==="function")

reelStopSound();






setTimeout(()=>{


slot.classList.remove(
"stopGlow"
);



},700);







},900+(index*FJ_CONFIG.reelDelay));



});









// край на завъртането


setTimeout(()=>{



finishSpin();



FJ.slots[2]

.classList.remove(
"lastReelFire"
);






fjCheckWin(result);






FJSpin.active=false;



FrozenJackpot.locked=false;



},FJ_CONFIG.spinTime);



}









// =================================
// WIN CHECK
// =================================


function fjCheckWin(result){



if(

result[0]==="💰"

&&

result[1]==="💰"

&&

result[2]==="💰"

){



if(typeof completeGame==="function"){


completeGame();


}



return;


}





if(

result[0]===result[1]

&&

result[1]===result[2]

){



FJ.message.innerHTML=

"✨ BIG WIN ✨";



}



else{


FJ.message.innerHTML=

"🎰 TRY AGAIN";


}



}









// =================================
// BUTTON CONNECTION
// =================================


spinBtn.onclick=function(){



if(totalSpins>=TOTAL_SPINS)

return;



if(sessionSpins>=SESSION_LIMIT){


startHold();


return;


}



fjStartSpin();



};







console.log(

"Frozen Jackpot V6 Spin Engine Loaded"

);



</script>

<script>



// =================================
// HOLD SETTINGS
// =================================


const FJ_HOLD={


time:120,


timer:null


};








// =================================
// CREATE ICE FACE
// =================================


function fjCreateIceFace(){



let face=document.createElement(
"div"
);



face.id="fjIceFace";



face.innerHTML=`

<div class="fjFrozenFace"></div>

`;



document.body.appendChild(face);



setTimeout(()=>{


face.classList.add(
"active"
);



},100);



}










// =================================
// SNOW GENERATOR
// =================================


function fjCreateSnow(){



for(let i=0;i<60;i++){



let snow=document.createElement(
"div"
);



snow.className="fjSnow";

snow.innerHTML="❄";



snow.style.left=

Math.random()*100+"vw";



snow.style.fontSize=

(15+

Math.random()*30)

+"px";



snow.style.animationDuration=

(4+

Math.random()*6)

+"s";





document.body.appendChild(snow);




setTimeout(()=>{


snow.remove();


},12000);



}



}









// =================================
// START FREEZE
// =================================


function fjStartFreeze(){



if(FrozenJackpot.hold)

return;



FrozenJackpot.hold=true;



holdActive=true;



spinBtn.disabled=true;





if(FJ.machine)

FJ.machine.classList.add(
"fjFrozen"
);





if(holdOverlay)

holdOverlay.style.display="flex";







fjCreateIceFace();


fjCreateSnow();







let end=

Date.now()

+

(FJ_HOLD.time*1000);







localStorage.setItem(

"FJFreezeEnd",

end

);








FJ_HOLD.timer=setInterval(()=>{



let left=Math.floor(

(end-Date.now())/1000

);






if(left<=0){


fjEndFreeze();


return;


}






if(timer){



let min=Math.floor(left/60);

let sec=left%60;



timer.innerHTML=

`${min<10?"0":""}${min}:${sec<10?"0":""}${sec}`;


}






},1000);








if(typeof freezeSound==="function")

freezeSound();



}









// =================================
// END FREEZE
// =================================


function fjEndFreeze(){



clearInterval(
FJ_HOLD.timer
);



FrozenJackpot.hold=false;



holdActive=false;



sessionSpins=0;



spinBtn.disabled=false;





if(FJ.machine)

FJ.machine.classList.remove(
"fjFrozen"
);





if(holdOverlay)

holdOverlay.style.display="none";






let face=document.getElementById(
"fjIceFace"
);



if(face)

face.remove();





document

.querySelectorAll(".fjSnow")

.forEach(x=>x.remove());






localStorage.removeItem(
"FJFreezeEnd"
);




saveGame();



message.innerHTML=

"🎰 READY";



}









// =================================
// CONNECT HOLD BUTTON
// =================================


startHold=function(){


fjStartFreeze();


};







console.log(

"Frozen Jackpot V6 Ice Freeze Loaded"

);



</script>

<script>



// =================================
// DEVICE CHECK
// =================================


const FJ_DEVICE={


mobile:

window.innerWidth<600,


lowPower:

false


};








// =================================
// HARDWARE OPTIMIZATION
// =================================


function fjOptimizeDevice(){



let cores=

navigator.hardwareConcurrency || 8;





if(cores<=4){


FJ_DEVICE.lowPower=true;



document.body.classList.add(

"fjLowPower"

);



}







document.documentElement.style.touchAction=

"manipulation";



}





fjOptimizeDevice();









// =================================
// VIBRATION ENGINE
// =================================


function fjVibrate(power=50){



if(

navigator.vibrate

){


navigator.vibrate(power);


}






if(FJ.machine){



FJ.machine.classList.add(
"fjShake"
);



setTimeout(()=>{


FJ.machine.classList.remove(
"fjShake"
);



},200);



}



}







// заменя старото вибриране


phoneVibrate=fjVibrate;









// =================================
// AUDIO SYSTEM
// =================================


let fjAudio=null;






function fjAudioInit(){



if(!fjAudio){



fjAudio=

new AudioContext();



}




if(

fjAudio.state==="suspended"

){


fjAudio.resume();


}



return fjAudio;


}







function fjSound(freq,time,type="sine"){



let ctx=

fjAudioInit();





let osc=

ctx.createOscillator();



let gain=

ctx.createGain();



osc.type=type;


osc.frequency.value=freq;



gain.gain.value=.05;



osc.connect(gain);


gain.connect(
ctx.destination
);





osc.start();



osc.stop(

ctx.currentTime+

time

);



}









// =================================
// SOUND PACK
// =================================



spinSound=function(){



fjSound(
150,
0.08,
"square"
);



setTimeout(()=>{


fjSound(
220,
0.08,
"square"
);


},100);



};








reelStopSound=function(){



fjSound(
700,
0.12,
"triangle"
);



};









freezeSound=function(){



fjSound(
900,
0.25,
"sawtooth"
);



setTimeout(()=>{


fjSound(
300,
0.5,
"sine"
);



},300);



};









// =================================
// RESIZE FIX
// =================================


function fjResizeFix(){



document.body.style.height=

"100dvh";






if(FJ.slots){



FJ.slots.forEach(slot=>{

}

"resize",

"beforeunload",

()=>{

saveGame();


}



});








console.log(

"Frozen Jackpot V6 Mobile Optimization Loaded"

);



</script>
