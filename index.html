<!DOCTYPE html>
<html lang="bg">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Frozen Jackpot V4</title>


<style>

/* ==========================
RESET
========================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,body{

width:100%;
height:100%;

overflow:hidden;

font-family:
Arial,
Helvetica,
sans-serif;

}


/* ==========================
MOBILE PORTRAIT BASE
========================== */


body{

display:flex;

justify-content:center;

align-items:center;

position:relative;

color:white;


background:

radial-gradient(
circle at center,
#990000,
#350000 45%,
#050505 90%
);


}



/* ==========================
FESTIVAL BACKGROUND
========================== */


body::before{

content:"";

position:absolute;

inset:-50%;


background:

conic-gradient(

transparent,

rgba(255,215,0,.45),

transparent,

rgba(255,0,80,.35),

transparent,

rgba(0,220,255,.35),

transparent

);



animation:

festivalSpin 12s linear infinite;


}




@keyframes festivalSpin{


from{

transform:rotate(0deg);

}


to{

transform:rotate(360deg);

}


}





body::after{

content:"";


position:absolute;

inset:0;



background-image:

radial-gradient(
gold 1px,
transparent 1px
);



background-size:

35px 35px;



opacity:.25;



animation:

starsMove 15s linear infinite;


}




@keyframes starsMove{


from{

background-position:

0 0;

}


to{

background-position:

250px 350px;

}


}







/* ==========================
MAIN MACHINE
========================== */


.machine{


position:relative;

z-index:5;


width:94vw;

max-width:520px;


padding:25px;



background:

linear-gradient(

145deg,

#252525,

#050505

);



border:

5px solid gold;



border-radius:

35px;



text-align:center;



box-shadow:


0 0 35px gold,

0 0 100px orange;



transition:

1s;


}




.machine.frozen{


filter:

brightness(.45)
blur(3px)
saturate(.2);


transform:

scale(.97);


}





/* ==========================
TITLE
========================== */


h1{


font-size:

clamp(45px,12vw,75px);



font-weight:

900;



letter-spacing:

5px;



color:

#ffd700;



text-shadow:


0 0 20px gold,

0 0 70px orange;



}





.subtitle{


margin-top:5px;


font-size:14px;


letter-spacing:7px;


color:#ddd;


}






/* ==========================
SLOT DISPLAY
========================== */


.display{


margin-top:30px;


padding:20px;



background:

#000;



border-radius:25px;



border:

3px solid #555;



box-shadow:


inset 0 0 40px black;



}





.slots{


display:flex;


justify-content:center;


gap:10px;


}





.slot{


width:90px;


height:90px;



display:flex;


align-items:center;


justify-content:center;



font-size:55px;



background:


linear-gradient(

145deg,

#333,

#111

);



border:

3px solid gold;



border-radius:18px;



box-shadow:


0 0 20px gold,

inset 0 0 20px black;



overflow:hidden;


}




/* ==========================
REEL BLUR SPIN
========================== */


.slot.spinning{


filter:

blur(5px);



animation:

reelBlur .08s infinite linear;


}




@keyframes reelBlur{


0%{

transform:

translateY(-20px)
scaleY(1.2);

}



50%{

transform:

translateY(20px)
scaleY(.8);

}



100%{

transform:

translateY(-20px)
scaleY(1.2);

}


}





/* ==========================
BUTTON
========================== */


button{


margin-top:30px;


width:90%;


padding:18px;



font-size:25px;



font-weight:bold;



border:none;



border-radius:50px;



cursor:pointer;



background:


linear-gradient(

gold,

orange

);



color:#222;



box-shadow:


0 0 40px gold;



}





button:disabled{


opacity:.4;


}






/* ==========================
TEXT
========================== */


#message{


margin-top:25px;



font-size:28px;



color:gold;



text-shadow:


0 0 20px gold;



}




#counter{


margin-top:15px;


font-size:18px;


color:#bbb;


}






/* ==========================
HOLD HTML STYLES BASE
========================== */


#ice{


display:none;


position:fixed;


inset:0;


z-index:20;


pointer-events:none;


background:


radial-gradient(

circle,

transparent 35%,

rgba(120,220,255,.4),

rgba(255,255,255,.85)

);



box-shadow:


inset 0 0 120px cyan;


}





#holdOverlay{


display:none;


position:fixed;


inset:0;


z-index:30;



justify-content:center;


align-items:center;



background:

rgba(0,0,0,.85);



backdrop-filter:

blur(12px);


}






#holdBox{


width:90%;


max-width:450px;


padding:40px;



text-align:center;



background:


linear-gradient(

145deg,

#222,

#050505

);



border-radius:35px;



border:

5px solid gold;



box-shadow:


0 0 50px cyan,

0 0 100px gold;


}




#holdTitle{


font-size:

80px;



font-weight:

900;



letter-spacing:

10px;



background:


linear-gradient(

white,

cyan,

gold

);



-webkit-background-clip:text;


color:transparent;


}





#timer{


margin-top:25px;


font-size:50px;


color:white;


}





.progress{


height:25px;


width:85%;


margin:30px auto;


background:#111;


border:

3px solid gold;


border-radius:30px;


overflow:hidden;


}



#progressBar{


height:100%;


width:100%;


background:

linear-gradient(

90deg,

cyan,

white,

gold

);


}





.holdText{


color:#aaa;


letter-spacing:3px;


}


/* ЧАСТ 2 започва директно след този код */

</style>

</head>


<body>


<div id="ice"></div>


<div class="machine" id="machine">


<h1>
JACKPOT
</h1>


<div class="subtitle">

VARIABLE REWARD

</div>


<div class="display">


<div class="slots">


<div class="slot" id="s1">
🍒
</div>


<div class="slot" id="s2">
⭐
</div>


<div class="slot" id="s3">
💎
</div>


</div>


</div>



<button id="spinBtn">

🎰 SPIN

</button>



<div id="message">

Almost...

</div>



<div id="counter">

Spin: 0 / 100

</div>


<div id="final"></div>


</div>





<div id="holdOverlay">


<div id="holdBox">


<div id="holdTitle">

HOLD

</div>


<div id="timer">

02:00

</div>


<div class="progress">

<div id="progressBar"></div>

</div>


<div class="holdText">

The machine is freezing...

</div>


</div>


</div>


<!-- ЧАСТ 3 ще се добави след HTML частта -->
