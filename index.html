<!DOCTYPE html>
<html lang="bg">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Frozen Jackpot V4</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<style>


/* 
 PART 2 CSS ЩЕ ДОЙДЕ ТУК
 */


</style>


</head>


<body>


<!-- =====================================
     BACKGROUND EFFECT LAYERS
===================================== -->


<div id="backgroundLayer"></div>

<div id="iceLayer"></div>

<div id="flashLayer"></div>




<!-- =====================================
     MAIN CASINO MACHINE
===================================== -->


<div class="machine" id="machine">


<h1 id="title">

JACKPOT

</h1>


<div class="subtitle">

FROZEN VARIABLE REWARD

</div>




<!-- =====================================
     SLOT DISPLAY
===================================== -->


<div class="display">


<div class="slots">


<div class="slot" id="slot1">

🍒

</div>


<div class="slot" id="slot2">

⭐

</div>


<div class="slot" id="slot3">

💎

</div>



</div>


</div>






<button id="spinButton">

🎰 SPIN

</button>





<div id="message">

Almost...

</div>





<div id="counter">

Spin: 0 / 100

</div>





<div id="finalMessage">


</div>



</div>










<!-- =====================================
        HOLD FREEZE SCREEN
===================================== -->


<div id="holdOverlay">



<!-- хорър ледена атмосфера -->


<div id="iceFace">


<div class="faceGlow"></div>


<div class="horrorText">

THE MACHINE IS WATCHING...

</div>


</div>







<div id="holdBox">



<div id="holdTitle">

HOLD

</div>





<div id="holdTimer">

02:00

</div>







<div class="progressContainer">


<div id="progressBar">

</div>


</div>






<div id="holdText">


THE MACHINE IS FREEZING...


<br><br>


WAIT FOR NEXT SPINS


</div>



</div>


</div>









<!-- =====================================
        PARTICLE CONTAINERS
===================================== -->


<div id="snowContainer"></div>


<div id="coinContainer"></div>




<!-- =====================================
        JAVASCRIPT PARTS WILL FOLLOW
===================================== -->


</body>

</html>
