<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Frozen Jackpot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" class="app">
    <header class="header">
      <h1>Frozen Jackpot</h1>
      <div class="balance" id="balance">Balance: $0</div>
    </header>

    <section class="machine">
      <div class="reels" id="reels">
        <div class="reel" data-index="0">
          <div class="symbol">🍒</div>
        </div>
        <div class="reel" data-index="1">
          <div class="symbol">🍋</div>
        </div>
        <div class="reel" data-index="2">
          <div class="symbol">⭐</div>
        </div>
      </div>

      <div class="controls">
        <button id="spinButton" class="btn primary">SPIN</button>
        <div class="bet">
          <label for="betInput">Bet</label>
          <input id="betInput" type="number" min="1" value="1">
        </div>
      </div>

      <div class="holds" id="holds">
        <button class="hold" data-index="0">HOLD</button>
        <button class="hold" data-index="1">HOLD</button>
        <button class="hold" data-index="2">HOLD</button>
      </div>

      <div class="info">
        <div id="message" class="message">Good luck!</div>
      </div>

      <div class="footer-controls">
        <button id="resetButton" class="btn">Reset</button>
        <button id="soundToggle" class="btn">🔊</button>
      </div>
    </section>

    <footer class="footer">
      <small>Saved locally. Works on mobile.</small>
    </footer>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
