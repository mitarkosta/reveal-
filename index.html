<script>

/* =====================================
 FROZEN JACKPOT V8 FINAL
 PART 3
 MAIN ENGINE
===================================== */


window.FrozenJackpot = {


    totalSpins:0,

    sessionSpins:0,

    locked:false,

    frozen:false,

    jackpot:false


};





const FJ_CONFIG = {


    TOTAL_SPINS:100,

    SESSION_LIMIT:5,

    HOLD_TIME:10000


};






const FJ = {


    machine:
    document.getElementById("machine"),


    slots:[

    document.getElementById("s1"),

    document.getElementById("s2"),

    document.getElementById("s3")

    ],



    button:
    document.getElementById("spinBtn"),



    message:
    document.getElementById("message"),



    counter:
    document.getElementById("counter")


};






const symbols=[

"🍒",

"🍋",

"⭐",

"💎",

"🔔",

"7️⃣",

"💰"

];







/* ===============================
 SAVE
=============================== */


function fjSave(){


localStorage.setItem(

"FrozenJackpotV8",


JSON.stringify({

total:
FrozenJackpot.totalSpins,


session:
FrozenJackpot.sessionSpins


})


);


}









function fjLoad(){


let save=

localStorage.getItem(
"FrozenJackpotV8"
);



if(!save)

return;



let data=

JSON.parse(save);



FrozenJackpot.totalSpins=

data.total || 0;



FrozenJackpot.sessionSpins=

data.session || 0;



}








/* ===============================
 UPDATE
=============================== */


function fjUpdate(){


if(FJ.counter){


FJ.counter.innerHTML=

FrozenJackpot.totalSpins+

"/100";


}



}





function fjMessage(t){


if(FJ.message)

FJ.message.innerHTML=t;


}








/* ===============================
 SPIN
=============================== */


function fjSpin(){



if(FrozenJackpot.locked)

return;



if(FrozenJackpot.frozen)

return;



if(FrozenJackpot.jackpot)

return;





FrozenJackpot.locked=true;



FrozenJackpot.totalSpins++;

FrozenJackpot.sessionSpins++;





fjUpdate();

fjSave();



fjMessage(
"🎰 SPINNING..."
);







FJ.slots.forEach(slot=>{


slot.classList.add(
"fjSpinning"
);


});







FJ.slots.forEach((slot,index)=>{


setTimeout(()=>{


slot.classList.remove(
"fjSpinning"
);



slot.innerHTML=

symbols[

Math.floor(

Math.random()

*

symbols.length

)

];



},1000+(index*500));



});







setTimeout(()=>{


FrozenJackpot.locked=false;


fjCheck();


},3000);



}








/* ===============================
 CHECK GAME
=============================== */


function fjCheck(){



if(

FrozenJackpot.totalSpins>=

FJ_CONFIG.TOTAL_SPINS

){


startFinalJackpot();


return;


}






if(

FrozenJackpot.sessionSpins>=

FJ_CONFIG.SESSION_LIMIT

){


startHold();


return;


}



fjMessage(
"🎰 READY"
);



}









/* ===============================
 BUTTON
=============================== */


FJ.button.onclick=function(){


fjSpin();


};








/* ===============================
 START
=============================== */


fjLoad();


fjUpdate();



if(FJ.machine)

FJ.machine.classList.add(
"fjReady"
);





console.log(
"❄️ FROZEN JACKPOT V8 ENGINE READY"
);



</script>
<script>

/* =====================================
 FROZEN JACKPOT V8 FINAL
 PART 4
 HOLD ICE WORLD
===================================== */


let fjHoldTimer=null;





/* ===============================
 START HOLD
=============================== */


function startHold(){



if(FrozenJackpot.frozen)

return;



FrozenJackpot.frozen=true;





if(FJ.machine){


FJ.machine.classList.add(
"fjFrozenMachine"
);


}





if(FJ.button){


FJ.button.disabled=true;


}





fjMessage(
"❄️ MACHINE FROZEN ❄️"
);






createIceWorld();






let time=

Date.now()+

(FJ_CONFIG.HOLD_TIME);







fjHoldTimer=setInterval(()=>{


let left=

Math.floor(

(time-Date.now())/1000

);



if(left<=0){


endHold();


}



else{


fjMessage(

"❄️ FROZEN HOLD: "

+left+

" sec"

);


}



},500);




}









/* ===============================
 CREATE ICE EFFECTS
=============================== */


function createIceWorld(){





let overlay=document.createElement("div");


overlay.id="fjIce";


overlay.style.position="fixed";

overlay.style.inset="0";

overlay.style.zIndex="500";

overlay.style.pointerEvents="none";

overlay.style.background=

"linear-gradient(rgba(180,240,255,.4),rgba(0,120,255,.5))";



document.body.appendChild(overlay);









let face=document.createElement("div");


face.id="fjIceFace";


face.innerHTML="❄️";


face.style.position="fixed";

face.style.top="50%";

face.style.left="50%";

face.style.transform=

"translate(-50%,-50%)";


face.style.fontSize="180px";


face.style.zIndex="600";


face.style.filter=

"drop-shadow(0 0 50px cyan)";



document.body.appendChild(face);








// SNOW


for(let i=0;i<80;i++){



let snow=document.createElement("div");


snow.className="fjSnow";


snow.innerHTML="❄";



snow.style.position="fixed";


snow.style.top="-50px";


snow.style.left=

Math.random()*100+"vw";



snow.style.fontSize=

(20+Math.random()*30)+"px";



snow.style.animationDuration=

(4+Math.random()*6)+"s";



document.body.appendChild(snow);



}



}









/* ===============================
 END HOLD
=============================== */


function endHold(){



clearInterval(
fjHoldTimer
);





FrozenJackpot.frozen=false;



FrozenJackpot.sessionSpins=0;







if(FJ.machine){


FJ.machine.classList.remove(
"fjFrozenMachine"
);


}





if(FJ.button){


FJ.button.disabled=false;


}







document.querySelectorAll(

"#fjIce,"+

"#fjIceFace,"+

".fjSnow"

)

.forEach(el=>{


el.remove();


});







fjMessage(

"🎰 READY AGAIN"

);





fjSave();



}







console.log(
"❄️ PART 4 HOLD ICE WORLD READY"
);



</script>

);

function fjCreateCoins(){

"div"
);



coin.className="fjCoin";

Math.random()*Math.PI*2;

300+

coin

<script>

function createWinnerFace(){

// =================================

// =================================



function createWinnerTitle(){



let title=document.createElement(
"div"
);

`

<br>

🏆 ПОБЕДА 🏆

`;



document.body.appendChild(title);



}









// =================================
// AUDIO ENGINE
// =================================



let FJ_AUDIO=null;





function fjInitAudio(){



if(!FJ_AUDIO){


FJ_AUDIO=

new AudioContext();


}



if(FJ_AUDIO.state==="suspended"){


FJ_AUDIO.resume();


}



}









function fjTone(freq,time,type){



fjInitAudio();



let osc=

FJ_AUDIO.createOscillator();



let gain=

FJ_AUDIO.createGain();



osc.type=type;



osc.frequency.value=freq;



gain.gain.value=.05;



osc.connect(gain);


gain.connect(
FJ_AUDIO.destination
);



osc.start();



osc.stop(

FJ_AUDIO.currentTime+time

);



}









function fjJackpotSound(){



fjTone(
500,
0.2,
"square"
);



setTimeout(()=>{


fjTone(
900,
0.25,
"square"
);



},200);





setTimeout(()=>{


fjTone(
1400,
0.5,
"triangle"
);



},500);



}









// =================================
// CONNECT FINAL
// =================================



const oldFinalV5 =
startFinalJackpot;



startFinalJackpot=function(){



oldFinalV5();



setTimeout(()=>{


createWinnerFace();


createWinnerTitle();


fjJackpotSound();



},500);



};









// =================================
// VIBRATION
// =================================



function fjVibrate(){



if(navigator.vibrate){


navigator.vibrate(

[100,50,200,50,400]

);

startFinalJackpot;

<script>

".fjGoldFlash"

)

.forEach(el=>{

// =================================
// JACKPOT LOCK SYSTEM
// =================================


window.FJ_FINAL_LOCK=false;






function fjFinalGuard(){



if(FJ_FINAL_LOCK)

return false;



if(!FrozenJackpot)

return false;



if(FrozenJackpot.jackpot)

return false;



FJ_FINAL_LOCK=true;



return true;



}









// =================================
// PROTECT FINAL START
// =================================



if(typeof startFinalJackpot==="function"){



const oldStartFinalV6 =

startFinalJackpot;





startFinalJackpot=function(){



if(!fjFinalGuard())

return;



fjCleanEffects();



oldStartFinalV6();



};




}
