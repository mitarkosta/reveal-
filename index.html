<!DOCTYPE html>
<html lang="bg">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Almost Jackpot</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;

background:
radial-gradient(circle,#520000,#050505 75%);

display:flex;
justify-content:center;
align-items:center;

font-family:Arial, sans-serif;

overflow:hidden;

}


/* фон със светлини */

body::before{

content:"";

position:absolute;

inset:0;

background-image:

radial-gradient(gold 2px, transparent 2px);

background-size:50px 50px;

opacity:.15;

animation:stars 20s linear infinite;

}


@keyframes stars{

from{
transform:translateY(0);
}

to{
transform:translateY(80px);
}

}



/* машина */

.machine{

position:relative;

z-index:2;

width:95%;

max-width:600px;

background:

linear-gradient(#191919,#050505);

border:5px solid #ffd700;

border-radius:30px;

padding:40px;

text-align:center;


box-shadow:

0 0 30px gold,
0 0 80px orange;


transition:.3s;

}



.shake{

animation:shake .4s;

}


@keyframes shake{

0%{
transform:translateX(0);
}

20%{
transform:translateX(-15px);
}

40%{
transform:translateX(15px);
}

60%{
transform:translateX(-10px);
}

80%{
transform:translateX(10px);
}

100%{
transform:translateX(0);
}

}




h1{

font-size:65px;

color:#ffd700;

letter-spacing:5px;

text-shadow:

0 0 10px gold,
0 0 40px orange;


animation:glow 1.5s infinite alternate;

}



@keyframes glow{

from{

filter:brightness(1);

}

to{

filter:brightness(1.5);

}

}



.subtitle{

margin-top:10px;

color:white;

font-size:22px;

letter-spacing:6px;

}



/* дисплей */

.display{

margin-top:35px;

background:black;

border:3px solid #555;

border-radius:15px;

padding:20px;

box-shadow:

inset 0 0 20px black,
0 0 20px gold;

}



.slots{

display:flex;

justify-content:center;

gap:15px;

}



.slot{

width:100px;

height:100px;

background:#222;

border-radius:15px;

border:3px solid gold;

display:flex;

justify-content:center;

align-items:center;

font-size:55px;

box-shadow:

inset 0 0 20px black;

}



.spin{

animation:spin .12s infinite;

}



@keyframes spin{

0%{
transform:translateY(-15px);
}

50%{
transform:translateY(15px);
}

100%{
transform:translateY(-15px);
}

}



/* бутон */


button{

margin-top:35px;

padding:20px 60px;

font-size:28px;

font-weight:bold;

border:none;

border-radius:50px;

cursor:pointer;

background:

linear-gradient(#ffe066,#cc9900);

color:#111;


box-shadow:

0 0 25px gold;


transition:.3s;

}



button:hover{

transform:scale(1.08);

}



button:active{

transform:scale(.95);

}



button:disabled{

opacity:.5;

}



/* текст */

#message{

margin-top:30px;

font-size:32px;

font-weight:bold;

color:white;

min-height:45px;

text-shadow:

0 0 15px gold;

}



#attempt{

margin-top:15px;

color:#aaa;

font-size:18px;

}



#story{

margin-top:35px;

font-size:22px;

line-height:1.5;

color:white;

opacity:0;

transition:2s;

}



.show{

opacity:1!important;

}



/* конфети */

.confetti{

position:absolute;

width:12px;

height:20px;

top:-20px;

animation:fall 3s linear forwards;

}


@keyframes fall{

to{

transform:
translateY(110vh)
rotate(720deg);

}

}



.jackpot{

animation:jackpot 1s infinite;

}



@keyframes jackpot{

50%{

transform:scale(1.15);

}

}


</style>

</head>


<body>


<div class="machine" id="machine">


<h1>
JACKPOT
</h1>


<div class="subtitle">
TRY YOUR LUCK
</div>



<div class="display">


<div class="slots">


<div class="slot" id="s1">
🍒
</div>


<div class="slot" id="s2">
⭐
</div>


<div class="slot" id="s3">
💎
</div>


</div>


</div>



<button id="spinButton" onclick="spin()">

🎰 SPIN

</button>


<div id="message">

Almost...

</div>


<div id="attempt">

Attempt: 0

</div>


<div id="story">

</div>



</div>


<script>


let attempts = 0;

const symbols = [
"🍒",
"🍋",
"⭐",
"💎",
"7️⃣",
"🔔"
];


const machine = document.getElementById("machine");

const s1 = document.getElementById("s1");
const s2 = document.getElementById("s2");
const s3 = document.getElementById("s3");

const message = document.getElementById("message");

const attemptText = document.getElementById("attempt");

const button = document.getElementById("spinButton");

const story = document.getElementById("story");



/*
 Звуци чрез браузъра
*/

function sound(type){

let ctx = new AudioContext();

let osc = ctx.createOscillator();

let gain = ctx.createGain();


osc.connect(gain);

gain.connect(ctx.destination);



if(type==="spin"){

osc.frequency.value=180;

gain.gain.value=.05;

osc.start();

osc.stop(ctx.currentTime+.08);

}



if(type==="near"){

osc.frequency.value=500;

gain.gain.value=.08;

osc.start();

osc.frequency.linearRampToValueAtTime(
800,
ctx.currentTime+.3
);

osc.stop(ctx.currentTime+.35);

}



if(type==="win"){

osc.frequency.value=700;

gain.gain.value=.1;

osc.start();

osc.frequency.linearRampToValueAtTime(
1200,
ctx.currentTime+.5
);

osc.stop(ctx.currentTime+.8);

}

}




function randomSymbol(){

return symbols[
Math.floor(Math.random()*symbols.length)
];

}





function spin(){


attempts++;


attemptText.innerHTML=
"Attempt: " + attempts;



sound("spin");


machine.classList.add("shake");


setTimeout(()=>{

machine.classList.remove("shake");

},400);



let slots=[
s1,
s2,
s3
];



slots.forEach(slot=>{

slot.classList.add("spin");

});



let count=0;


let rolling=setInterval(()=>{


slots.forEach(slot=>{

slot.innerHTML=randomSymbol();

});


count++;



if(count>18){


clearInterval(rolling);



slots.forEach(slot=>{

slot.classList.remove("spin");

});



result();



}


},100);



}





function result(){



/*
 След 100 натискания идва наградата
*/


if(attempts>=100){

win();

return;

}




let chance=Math.random();



/*
 Редки "почти печалби"
*/


if(chance<0.12){


let near=[
["⭐","⭐","🍋"],
["💎","💎","⭐"],
["7️⃣","7️⃣","🔔"],
["🍒","🍒","💎"]
];


let combo =
near[
Math.floor(Math.random()*near.length)
];


s1.innerHTML=combo[0];
s2.innerHTML=combo[1];
s3.innerHTML=combo[2];


message.innerHTML=
"🔥 SO CLOSE... ONE SYMBOL AWAY";


sound("near");


}

else{


message.innerHTML=randomMessages();


}



}




function randomMessages(){


let texts=[

"❌ Not this time...",

"Almost...",

"That was close",

"You were so near",

"Maybe next spin",

"One more try",

"The jackpot is waiting",

"Just missed it",

"Nearly perfect",

"So close again",

"You almost had it",

"Don't stop now",

"The next one could be it",

"Only one symbol changed everything"

];


return texts[
Math.floor(Math.random()*texts.length)
];


}







function win(){



button.disabled=true;


s1.innerHTML="💰";
s2.innerHTML="⭐";
s3.innerHTML="💎";



message.innerHTML=
"🎉 JACKPOT! 🎉";


message.classList.add("jackpot");



sound("win");


createConfetti();



setTimeout(()=>{


story.classList.add("show");


story.innerHTML=

`

<h2 style="color:#ffd700">
But why did you keep trying?
</h2>

<br>

You didn't know when the reward would come.

<br><br>

Every attempt created a new expectation.

<br><br>

The "almost win" made you believe the next try could be different.

<br><br>

<b>
This is variable reinforcement.
</b>

<br><br>

The uncertainty itself became the motivation.

`;


},2500);



}





function createConfetti(){


for(let i=0;i<120;i++){


let c=document.createElement("div");


c.className="confetti";


c.style.left=
Math.random()*100+"vw";


c.style.background=
[
"gold",
"red",
"blue",
"green",
"white"
]
[
Math.floor(Math.random()*5)
];



c.style.animationDelay=
Math.random()*2+"s";



document.body.appendChild(c);



setTimeout(()=>{

c.remove();

},4000);



}



}



</script>


</body>

</html>
