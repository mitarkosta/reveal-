<script>


// =====================
// VARIABLES
// =====================


const TOTAL_SPINS = 100;

const SESSION_LIMIT = 10;

const HOLD_TIME = 120;


let totalSpins = 0;

let sessionSpins = 0;

let spinning = false;



const symbols = [
"🍒",
"🍋",
"⭐",
"💎",
"🔔",
"7️⃣"
];



const messages = [

"Almost...",

"So close...",

"One symbol away",

"Nearly there",

"You almost had it",

"Just missed",

"Maybe next spin",

"The next one could be it",

"Close again",

"Try once more"

];




// ELEMENTS


const s1=document.getElementById("s1");

const s2=document.getElementById("s2");

const s3=document.getElementById("s3");


const button=document.getElementById("spinBtn");


const message=document.getElementById("message");

const counter=document.getElementById("counter");


const holdOverlay=document.getElementById("holdOverlay");

const progressBar=document.getElementById("progressBar");

const timer=document.getElementById("timer");


const final=document.getElementById("final");




// =====================
// SOUND
// =====================


function sound(freq,duration){

let ctx=new AudioContext();

let osc=ctx.createOscillator();

let gain=ctx.createGain();


osc.connect(gain);

gain.connect(ctx.destination);


osc.frequency.value=freq;

gain.gain.value=.05;


osc.start();

osc.stop(ctx.currentTime+duration);

}





// =====================
// SAVE
// =====================


function save(){

localStorage.setItem(
"slotGame",
JSON.stringify({

totalSpins,

sessionSpins

})

);

}




function load(){

let data=
localStorage.getItem("slotGame");


if(data){

let game=JSON.parse(data);


totalSpins=game.totalSpins;

sessionSpins=game.sessionSpins;


counter.innerHTML=
`Spin: ${totalSpins} / ${TOTAL_SPINS}`;

}

}




// =====================
// SPIN
// =====================


button.onclick=function(){


if(spinning) return;


if(totalSpins>=TOTAL_SPINS){

return;

}



if(sessionSpins>=SESSION_LIMIT){

startHold();

return;

}



spin();

};





function spin(){


spinning=true;


totalSpins++;

sessionSpins++;


counter.innerHTML=
`Spin: ${totalSpins} / ${TOTAL_SPINS}`;


save();



sound(200,.15);



let slots=[s1,s2,s3];


slots.forEach(s=>{

s.classList.add("spin");

});



let count=0;


let interval=setInterval(()=>{


slots.forEach(s=>{

s.innerHTML=
symbols[
Math.floor(Math.random()*symbols.length)
];

});


count++;



if(count>=20){


clearInterval(interval);


slots.forEach(s=>{

s.classList.remove("spin");

});


result();


spinning=false;



}



},100);



}






// =====================
// RESULT
// =====================


function result(){


let chance=Math.random();



if(chance<0.15){



let near=[

["⭐","⭐","🍋"],

["💎","💎","⭐"],

["7️⃣","7️⃣","🔔"],

["🍒","🍒","💎"]

];


let combo=
near[
Math.floor(Math.random()*near.length)
];


s1.innerHTML=combo[0];

s2.innerHTML=combo[1];

s3.innerHTML=combo[2];


message.innerHTML=
"🔥 SO CLOSE";


sound(700,.3);



}

else{


message.innerHTML=
messages[
Math.floor(Math.random()*messages.length)
];


}



if(totalSpins>=TOTAL_SPINS){

finish();

}


}






// =====================
// HOLD
// =====================


function startHold(){


holdOverlay.style.display="flex";


button.disabled=true;



let end=

Date.now()+HOLD_TIME*1000;



localStorage.setItem(
"holdEnd",
end
);



runTimer(end);


}




function runTimer(end){



let interval=setInterval(()=>{


let remaining=

Math.floor(
(end-Date.now())/1000
);



if(remaining<=0){


clearInterval(interval);


endHold();


return;

}



let min=
Math.floor(remaining/60);


let sec=
remaining%60;


timer.innerHTML=

`${min<10?"0":""}${min}:${sec<10?"0":""}${sec}`;



progressBar.style.width=

(remaining/HOLD_TIME*100)+"%";



},1000);



}





function endHold(){


holdOverlay.style.display="none";


sessionSpins=0;


button.disabled=false;


localStorage.removeItem("holdEnd");


save();


message.innerHTML=
"🎰 READY";


}






// =====================
// RESTORE HOLD AFTER REFRESH
// =====================


function restoreHold(){


let saved=
localStorage.getItem("holdEnd");


if(!saved) return;


let end=parseInt(saved);


if(end>Date.now()){


holdOverlay.style.display="flex";

button.disabled=true;


runTimer(end);


}

else{

localStorage.removeItem("holdEnd");

}



}






// =====================
// FINAL
// =====================


function finish(){


button.disabled=true;


s1.innerHTML="💰";

s2.innerHTML="⭐";

s3.innerHTML="💎";


message.innerHTML=
"🎉 JACKPOT 🎉";


sound(1000,.8);



confetti();



setTimeout(()=>{


final.classList.add("show");


final.innerHTML=`

<h2 style="color:gold">
But why did you keep trying?
</h2>

<br>

You did not know when the reward would appear.

<br><br>

Every spin created a new expectation.

<br><br>

The uncertainty kept your attention.

<br><br>

<b>
You were not chasing the reward.
</b>

<br><br>

You were chasing the possibility of the reward.

<br><br>

This is variable reinforcement.

`;



},2500);



}






// =====================
// CONFETTI
// =====================


function confetti(){


for(let i=0;i<120;i++){


let c=document.createElement("div");


c.className="confetti";


c.style.left=
Math.random()*100+"vw";


c.style.background=

[
"gold",
"red",
"blue",
"green"
]
[
Math.floor(Math.random()*4)
];


document.body.appendChild(c);



setTimeout(()=>{

c.remove();

},4000);



}


}





// START

load();

restoreHold();



</script>

</html>

);



if(left<=0){


clearInterval(interval);


endHold();


return;

}



let min=

Math.floor(left/60);


let sec=

left%60;



timer.innerHTML=

`

${min<10?"0":""}${min}:

${sec<10?"0":""}${sec}

`;



progressBar.style.width=

(left/HOLD_TIME*100)

+"%";



},1000);



}






function endHold(){


holdActive=false;


sessionSpins=0;


spinBtn.disabled=false;


holdOverlay.style.display="none";


ice.style.display="none";


machine.classList.remove("frozen");


localStorage.removeItem(
"holdEnd"
);



saveGame();



message.innerHTML=

"🎰 READY";


}






// =======================
// RESTORE AFTER REFRESH
// =======================


function restoreHold(){


let saved=

localStorage.getItem(
"holdEnd"
);



if(!saved)
return;



let end=

Number(saved);



if(end>Date.now()){


holdActive=true;


spinBtn.disabled=true;


holdOverlay.style.display="flex";


ice.style.display="block";


machine.classList.add("frozen");


runTimer(end);



}

else{


localStorage.removeItem(
"holdEnd"
);


}


}







// =======================
// FINISH
// =======================


function completeGame(){


spinBtn.disabled=true;


slots[0].innerHTML="💰";

slots[1].innerHTML="⭐";

slots[2].innerHTML="💎";


message.innerHTML=

"🎉 JACKPOT 🎉";


jackpotSound();



createConfetti();



setTimeout(()=>{


final.classList.add("show");



final.innerHTML=

`

<h2 style="color:gold">

Why did you continue?

</h2>


<br>

The reward was uncertain.

<br><br>

Every spin created anticipation.

<br><br>

The possibility kept you engaged.

<br><br>

<b>
This is variable reinforcement.
</b>

`;


},2500);



}






// =======================
// CONFETTI
// =======================


function createConfetti(){


for(let i=0;i<120;i++){



let c=

document.createElement("div");


c.className="confetti";


c.style.left=

Math.random()*100+"vw";



c.style.background=

[
"gold",
"red",
"white",
"cyan"
]

[

Math.floor(

Math.random()*4

)

];



document.body.appendChild(c);



setTimeout(()=>{

c.remove();

},4000);



}



}






// START


loadGame();

restoreHold();
