<!-- =========================================
 FROZEN JACKPOT V6
 PART 1 / CLEAN BASE ENGINE
========================================= -->


<style>

/* ===============================
 BASE OPTIMIZATION
=============================== */

.slot,
#machine,
.fj-effect,
.fj-coin,
.fj-face,
.fj-snow {

    will-change: transform, opacity;

}


/* ===============================
 MACHINE STATES
=============================== */


.fjFrozen {

    filter:
    brightness(.7)
    hue-rotate(160deg);

    box-shadow:
    0 0 60px cyan,
    0 0 120px blue;

}



.fjReady {

    animation:
    fjReadyPulse 2s infinite alternate;

}



@keyframes fjReadyPulse {

from {

box-shadow:
0 0 20px gold;

}


to {

box-shadow:
0 0 70px orange;

}

}


</style>



<script>


// =================================
// FROZEN JACKPOT V6 CORE
// =================================


window.FrozenJackpot = {

    version:"V6",

    locked:false,

    frozen:false,

    jackpot:false,

    totalSpins:0,

    sessionSpins:0

};





// =================================
// GAME SETTINGS
// =================================


window.FJ_CONFIG = {

    TOTAL_SPINS:100,

    SESSION_LIMIT:5,

    HOLD_TIME:120

};







// =================================
// ELEMENT CACHE
// =================================


const FJ = {


machine:
document.getElementById("machine"),



slots:[

document.getElementById("s1"),

document.getElementById("s2"),

document.getElementById("s3")

],



button:
document.getElementById("spinBtn"),



message:
document.getElementById("message"),



counter:
document.getElementById("counter")


};






// =================================
// SYMBOL ENGINE
// =================================


FJ.symbols=[

"🍒",

"🍋",

"⭐",

"💎",

"🔔",

"7️⃣",

"💰"

];






// =================================
// SAVE SYSTEM
// =================================


function saveGame(){


localStorage.setItem(

"FROZEN_JACKPOT_SAVE",

JSON.stringify({

total:
FrozenJackpot.totalSpins,


session:
FrozenJackpot.sessionSpins


})

);


}







function loadGame(){


let data=

localStorage.getItem(
"FROZEN_JACKPOT_SAVE"
);



if(!data)

return;



try{


let save=

JSON.parse(data);



FrozenJackpot.totalSpins=

save.total || 0;



FrozenJackpot.sessionSpins=

save.session || 0;



}

catch(e){


console.log(
"Save reset"
);


}



}








// =================================
// COUNTER
// =================================


function updateCounter(){


if(FJ.counter){


FJ.counter.innerHTML=

FrozenJackpot.totalSpins
+
"/"
+
FJ_CONFIG.TOTAL_SPINS;


}


}








// =================================
// STARTUP
// =================================


loadGame();

updateCounter();



if(FJ.machine){

FJ.machine.classList.add(
"fjReady"
);

}



console.log(
"Frozen Jackpot V6 PART 1 READY"
);



</script>
