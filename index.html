<!-- =========================================
 PART 2 / OPTIMIZED SPIN ENGINE
 ПОСТАВИ СЛЕД PART 1
========================================= -->


<script>


// =================================
// SPIN SETTINGS
// =================================


const FJ_SPIN_TIME = 3000;

const FJ_REEL_DELAY = 550;






// =================================
// NEW SPIN ENGINE
// =================================



function optimizedSpin(){



if(FrozenJackpot.locked)

return;



if(FrozenJackpot.hold)

return;





FrozenJackpot.locked=true;



spinning=true;



totalSpins++;

sessionSpins++;





updateCounter();

saveGame();



spinSound();


phoneVibrate();






// ===============================
// START REELS
// ===============================



FJ.slots.forEach(slot=>{


slot.classList.add(
"spinning"
);


});









// ===============================
// 5TH SPIN ANTICIPATION
// ПО ВРЕМЕ НА ВЪРТЕНЕТО
// ===============================



if(totalSpins % 5 === 0){



setTimeout(()=>{



let fireReel=
FJ.slots[2];



fireReel.classList.add(
"lastReelFire"
);



FJ.message.innerHTML=

"🔥 JACKPOT IS CLOSE...";




},700);



}









// ===============================
// STOP REELS
// ===============================



FJ.slots.forEach((slot,index)=>{



setTimeout(()=>{



slot.classList.remove(
"spinning"
);



slot.classList.add(
"stopGlow"
);





slot.innerHTML=

FJ.symbols[

Math.floor(

Math.random()*

FJ.symbols.length

)

];






reelStopSound();







setTimeout(()=>{


slot.classList.remove(
"stopGlow"
);



},600);






},900+(index*FJ_REEL_DELAY));



});









// ===============================
// FINISH
// ===============================



setTimeout(()=>{



FJ.slots.forEach(slot=>{


slot.classList.remove(
"spinning"
);


});





FJ.slots[2].classList.remove(
"lastReelFire"
);





finishSpin();



spinning=false;



FrozenJackpot.locked=false;



},FJ_SPIN_TIME);





}








// =================================
// REPLACE BUTTON
// =================================



spinBtn.onclick=function(){



if(totalSpins>=TOTAL_SPINS)

return;



if(sessionSpins>=SESSION_LIMIT){


startHold();


return;


}



optimizedSpin();



};









console.log(
"Frozen Jackpot Spin Engine Loaded"
);



</script>

/* ===============================
 SNOW
=============================== */


.fjSnow{


position:fixed;

</style>







<script>



// =================================
// HOLD VARIABLES
// =================================


const FJ_HOLD_TIME = 120;



let fjHoldTimer;







// =================================
// CREATE ICE FACE
// =================================



function showIceFace(){



let face=document.createElement("div");



face.id="iceFace";



face.innerHTML=`

<div class="frozenFace"></div>

`;



document.body.appendChild(face);



setTimeout(()=>{


face.classList.add(
"active"
);



},100);



return face;


}







// =================================
// SNOW EFFECT
// =================================


function startFrozenSnow(){



for(let i=0;i<70;i++){



let snow=document.createElement("div");



snow.className="fjSnow";



snow.innerHTML="❄";



snow.style.left=

Math.random()*100+"vw";



snow.style.fontSize=

(15+Math.random()*30)+"px";



snow.style.animationDuration=

(4+Math.random()*8)+"s";



document.body.appendChild(snow);





setTimeout(()=>{


snow.remove();


},12000);



}



}







function clearFrozenSnow(){



document

.querySelectorAll(".fjSnow")

.forEach(x=>x.remove());



}









// =================================
// START HOLD
// =================================



function optimizedHold(){



if(FrozenJackpot.hold)

return;



FrozenJackpot.hold=true;



holdActive=true;



spinBtn.disabled=true;



machine.classList.add(
"frozen"
);




if(holdOverlay)

holdOverlay.style.display="flex";





freezeSound();



showIceFace();



startFrozenSnow();







let endTime=

Date.now()

+

(FJ_HOLD_TIME*1000);





localStorage.setItem(

"FrozenHoldEnd",

endTime

);






fjHoldTimer=setInterval(()=>{



let left=Math.floor(

(endTime-Date.now())/1000

);





if(left<=0){



clearInterval(
fjHoldTimer
);



endFrozenHold();



return;


}






let min=Math.floor(left/60);


let sec=left%60;





if(timer)

timer.innerHTML=

`

${min<10?"0":""}${min}:

${sec<10?"0":""}${sec}

`;





if(progressBar)

progressBar.style.width=

(left/FJ_HOLD_TIME*100)+"%";




},1000);




}









// =================================
// END HOLD
// =================================



function endFrozenHold(){



FrozenJackpot.hold=false;



holdActive=false;



sessionSpins=0;



spinBtn.disabled=false;



machine.classList.remove(
"frozen"
);




if(holdOverlay)

holdOverlay.style.display="none";




let face=

document.getElementById(
"iceFace"
);



if(face)

face.remove();




clearFrozenSnow();




localStorage.removeItem(
"FrozenHoldEnd"
);



saveGame();



message.innerHTML=

"🎰 READY";



}








// =================================
// REPLACE OLD HOLD
// =================================



startHold=function(){


optimizedHold();


};







console.log(
"Frozen Hold System Loaded"
);



</script>


<!-- =========================================

 ПОСТАВИ СЛЕД PART 3
========================================= -->


<style>


/* ===============================
 PERFORMANCE MODE
=============================== */


.performanceMode *{


animation-duration:

.85;

/* ===============================
 MOBILE GPU OPTIMIZATION
=============================== */

.fjSnow{

translateZ(0);


backface-visibility:hidden;

/* ===============================
 PHONE SHAKE
=============================== */


.phoneShake{


animation:

phoneShakeAnim .15s;


}



@keyframes phoneShakeAnim{


0%{

transform:translateX(0);

}


25%{

transform:translateX(-8px);

}


50%{

transform:translateX(8px);

}


75%{

transform:translateX(-5px);

}


100%{

transform:translateX(0);

}


}






</style>








<script>




// =================================
// MOBILE DETECTION
// =================================



const FJ_MOBILE =

window.innerWidth < 600;







// =================================
// OPTIMIZED VIBRATION
// =================================



function optimizedVibrate(pattern=50){



if(

navigator.vibrate

){



navigator.vibrate(pattern);


}



if(FJ.machine){



FJ.machine.classList.add(

"phoneShake"

);



setTimeout(()=>{


FJ.machine.classList.remove(

"phoneShake"

);



},180);



}



}







// заменя старата вибрация


phoneVibrate=function(){



optimizedVibrate(60);



};









// =================================
// AUDIO MANAGER
// =================================



let FJ_audio=null;



function initFJAudio(){



if(!FJ_audio){



FJ_audio=

new AudioContext();



}



if(FJ_audio.state==="suspended"){


FJ_audio.resume();


}



return FJ_audio;


}








function fjTone(freq,duration,type="sine"){



let ctx=

initFJAudio();



let osc=

ctx.createOscillator();



let gain=

ctx.createGain();



osc.type=type;


osc.frequency.value=freq;



gain.gain.value=.06;



osc.connect(gain);


gain.connect(
ctx.destination
);



osc.start();



osc.stop(

ctx.currentTime+

duration

);



}







// ===============================
// NEW SOUND PACK
// ===============================



function fjSpinSound(){



fjTone(
160,
.08,
"square"
);



setTimeout(()=>{


fjTone(
220,
.08,
"square"
);



},100);



}





function fjStopSound(){



fjTone(
650,
.12,
"triangle"
);



}






function fjFreezeSound(){



fjTone(
900,
.25,
"sawtooth"
);



setTimeout(()=>{


fjTone(
350,
.5,
"sine"
);



},250);



}







// заменяне на звуците


spinSound=fjSpinSound;


reelStopSound=fjStopSound;


freezeSound=fjFreezeSound;









// =================================
// FPS CONTROL
// =================================



function optimizeAnimations(){



let lowPower =

navigator.hardwareConcurrency &&

navigator.hardwareConcurrency<=4;





if(lowPower){



document.body.classList.add(

"performanceMode"

);



document
.querySelectorAll(".fjSnow")
.forEach(s=>{


s.style.animationDuration="8s";


});



}



}







// =================================
// RESIZE FIX
// =================================



function mobileResizeFix(){



document.body.style.height=

"100dvh";



if(FJ.slots){



FJ.slots.forEach(slot=>{


if(window.innerWidth<600){


slot.style.width="82px";


slot.style.height="82px";


slot.style.fontSize="45px";


}



});



}



}





window.addEventListener(

"resize",

mobileResizeFix

);






mobileResizeFix();

optimizeAnimations();









// =================================
// SAVE PROTECTION
// =================================



window.addEventListener(

"beforeunload",

()=>{


if(typeof saveGame==="function"){


saveGame();


}



}

);









console.log(

"Frozen Jackpot Mobile Optimization Loaded"

);



</script>
