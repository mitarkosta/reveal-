<!-- =====================================
 FROZEN JACKPOT V8 FINAL
 PART 1
 HTML CORE
===================================== -->


<div id="machine" class="fjMachine">


    <!-- HEADER -->

    <div class="fjHeader">

        ❄️ FROZEN JACKPOT ❄️

    </div>



    <!-- COUNTER -->

    <div id="counter" class="fjCounter">

        0 / 100

    </div>




    <!-- SLOT MACHINE -->

    <div class="fjSlots">


        <div id="s1" class="slot">

            🍒

        </div>



        <div id="s2" class="slot">

            🍋

        </div>



        <div id="s3" class="slot">

            ⭐

        </div>


    </div>





    <!-- MESSAGE -->

    <div id="message" class="fjMessage">

        🎰 READY

    </div>






    <!-- BUTTON -->

    <button id="spinBtn" class="fjButton">

        SPIN

    </button>




</div>




<!-- EFFECT CONTAINER -->

<div id="fjEffects"></div>
<style>

/* =====================================
 FROZEN JACKPOT V8 FINAL
 PART 2
 CSS ENGINE
===================================== */



body{

background:#020611;

color:white;

font-family:Arial, sans-serif;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

overflow:hidden;

}




/* MACHINE */


.fjMachine{


width:360px;

padding:30px;

border-radius:30px;


background:

linear-gradient(

145deg,

#111,

#222

);


box-shadow:


0 0 40px cyan;


text-align:center;


transition:.5s;


}






/* HEADER */


.fjHeader{


font-size:32px;

font-weight:900;


color:#00eaff;


text-shadow:


0 0 20px cyan;


margin-bottom:20px;


}






/* COUNTER */


.fjCounter{


font-size:24px;


margin-bottom:20px;


color:#ffd700;


}







/* SLOTS */


.fjSlots{


display:flex;


justify-content:center;


gap:15px;


}




.slot{


width:90px;

height:90px;


display:flex;


align-items:center;

justify-content:center;



font-size:50px;


background:white;


color:black;


border-radius:15px;


box-shadow:


inset 0 0 20px #999,


0 0 20px cyan;


}





/* MESSAGE */


.fjMessage{


margin:25px;


font-size:22px;


font-weight:bold;


}







/* BUTTON */


.fjButton{


padding:15px 40px;


font-size:25px;


font-weight:900;


border:0;


border-radius:20px;


cursor:pointer;


background:

linear-gradient(

gold,

orange

);



box-shadow:


0 0 30px gold;


}



.fjButton:active{


transform:scale(.9);


}







/* READY EFFECT */


.fjReady{


animation:

readyPulse 1.5s infinite alternate;


}



@keyframes readyPulse{


from{


box-shadow:

0 0 30px cyan;


}


to{


box-shadow:

0 0 100px gold;


}


}





/* SPIN EFFECT */


.fjSpinning{


animation:

spinRoll .15s linear infinite;


}




@keyframes spinRoll{


from{


transform:

rotateX(0deg);


}


to{


transform:

rotateX(360deg);


}



}





/* FROZEN */


.fjFrozenMachine{


filter:

brightness(.6)

hue-rotate(170deg);



box-shadow:


0 0 80px cyan,

0 0 180px blue;



}





/* FINAL */


.fjFinalMode{


animation:

finalGlow .6s infinite alternate;


}



@keyframes finalGlow{


from{


box-shadow:

0 0 50px gold;


}


to{


box-shadow:

0 0 200px white,

0 0 300px gold;


}



}






/* COINS */


.fjCoin{


position:fixed;


top:50%;

left:50%;


font-size:35px;


z-index:999;


pointer-events:none;


animation:

coinFly 4s forwards;


}



@keyframes coinFly{


from{


transform:

translate(-50%,-50%)

scale(.2);


opacity:1;


}


to{


transform:

translate(

calc(-50% + var(--x)),

calc(-50% + var(--y))

)

rotate(900deg);


opacity:0;


}



}





</style>
<script>

/* =====================================
 FROZEN JACKPOT V8 FINAL
 PART 3
 MAIN ENGINE
===================================== */


window.FrozenJackpot = {


    totalSpins:0,

    sessionSpins:0,

    locked:false,

    frozen:false,

    jackpot:false


};





const FJ_CONFIG = {


    TOTAL_SPINS:100,

    SESSION_LIMIT:5,

    HOLD_TIME:10000


};






const FJ = {


    machine:
    document.getElementById("machine"),


    slots:[

    document.getElementById("s1"),

    document.getElementById("s2"),

    document.getElementById("s3")

    ],



    button:
    document.getElementById("spinBtn"),



    message:
    document.getElementById("message"),



    counter:
    document.getElementById("counter")


};






const symbols=[

"🍒",

"🍋",

"⭐",

"💎",

"🔔",

"7️⃣",

"💰"

];







/* ===============================
 SAVE
=============================== */


function fjSave(){


localStorage.setItem(

"FrozenJackpotV8",


JSON.stringify({

total:
FrozenJackpot.totalSpins,


session:
FrozenJackpot.sessionSpins


})


);


}









function fjLoad(){


let save=

localStorage.getItem(
"FrozenJackpotV8"
);



if(!save)

return;



let data=

JSON.parse(save);



FrozenJackpot.totalSpins=

data.total || 0;



FrozenJackpot.sessionSpins=

data.session || 0;



}








/* ===============================
 UPDATE
=============================== */


function fjUpdate(){


if(FJ.counter){


FJ.counter.innerHTML=

FrozenJackpot.totalSpins+

"/100";


}



}





function fjMessage(t){


if(FJ.message)

FJ.message.innerHTML=t;


}








/* ===============================
 SPIN
=============================== */


function fjSpin(){



if(FrozenJackpot.locked)

return;



if(FrozenJackpot.frozen)

return;



if(FrozenJackpot.jackpot)

return;





FrozenJackpot.locked=true;



FrozenJackpot.totalSpins++;

FrozenJackpot.sessionSpins++;





fjUpdate();

fjSave();



fjMessage(
"🎰 SPINNING..."
);







FJ.slots.forEach(slot=>{


slot.classList.add(
"fjSpinning"
);


});







FJ.slots.forEach((slot,index)=>{


setTimeout(()=>{


slot.classList.remove(
"fjSpinning"
);



slot.innerHTML=

symbols[

Math.floor(

Math.random()

*

symbols.length

)

];



},1000+(index*500));



});







setTimeout(()=>{


FrozenJackpot.locked=false;


fjCheck();


},3000);



}








/* ===============================
 CHECK GAME
=============================== */


function fjCheck(){



if(

FrozenJackpot.totalSpins>=

FJ_CONFIG.TOTAL_SPINS

){


startFinalJackpot();


return;


}






if(

FrozenJackpot.sessionSpins>=

FJ_CONFIG.SESSION_LIMIT

){


startHold();


return;


}



fjMessage(
"🎰 READY"
);



}









/* ===============================
 BUTTON
=============================== */


FJ.button.onclick=function(){


fjSpin();


};








/* ===============================
 START
=============================== */


fjLoad();


fjUpdate();



if(FJ.machine)

FJ.machine.classList.add(
"fjReady"
);





console.log(
"❄️ FROZEN JACKPOT V8 ENGINE READY"
);



</script>
