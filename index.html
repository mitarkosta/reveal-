<!DOCTYPE html>
<html lang="bg">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Almost Jackpot</title>


<style>


*{
box-sizing:border-box;
margin:0;
padding:0;
}



body{


height:100vh;


background:

radial-gradient(
circle,
#650000,
#050505 80%
);



display:flex;

justify-content:center;

align-items:center;



font-family:Arial, sans-serif;



overflow:hidden;


}





body:before{


content:"";


position:absolute;


inset:0;


background-image:

radial-gradient(
gold 1px,
transparent 1px
);


background-size:45px 45px;


opacity:.15;


animation:bg 20s linear infinite;


}



@keyframes bg{


from{

transform:translateY(0);

}

to{

transform:translateY(100px);

}

}







.machine{


position:relative;


z-index:2;



width:95%;

max-width:650px;



padding:40px;



background:

linear-gradient(
145deg,
#222,
#050505
);



border:5px solid gold;



border-radius:35px;



text-align:center;



box-shadow:

0 0 40px gold,
0 0 100px orange;



transition:1s;



}




.frozen{


filter:

blur(2px)
brightness(.5)
saturate(.4);



}




h1{


font-size:65px;



color:#ffd700;



text-shadow:

0 0 20px gold,
0 0 50px orange;



}





.subtitle{


margin-top:10px;


letter-spacing:7px;


color:white;


}







.display{


margin-top:40px;


padding:25px;



background:#000;



border-radius:20px;



border:3px solid #777;



box-shadow:

inset 0 0 30px black;


}





.slots{


display:flex;


justify-content:center;


gap:15px;


}



.slot{


width:110px;


height:110px;



display:flex;


align-items:center;


justify-content:center;



font-size:60px;



background:#222;



border:3px solid gold;



border-radius:15px;


}





.spin{


animation:

spin .12s infinite;


}




@keyframes spin{


50%{

transform:translateY(15px);

}


}





button{


margin-top:35px;



padding:20px 60px;



font-size:28px;



font-weight:bold;



border:none;



border-radius:50px;



background:

linear-gradient(
gold,
orange
);



cursor:pointer;



box-shadow:

0 0 30px gold;



}



button:disabled{


opacity:.4;


}







#message{


margin-top:30px;


font-size:32px;



color:gold;


}





#counter{


margin-top:15px;


color:#aaa;


}







/* ==================
ICE EFFECT
================== */



#ice{


position:fixed;


inset:0;



display:none;



z-index:10;



pointer-events:none;



background:


radial-gradient(

circle,

transparent 45%,

rgba(180,240,255,.3)

75%,

rgba(255,255,255,.8)

100%

);



box-shadow:


inset 0 0 100px 40px #bff4ff;



animation:

icePulse 3s infinite alternate;


}





@keyframes icePulse{


from{

opacity:.6;

}


to{

opacity:1;

}


}







/* ==================
HOLD
================== */


#holdOverlay{


position:fixed;


inset:0;



display:none;



justify-content:center;


align-items:center;



background:

rgba(0,0,0,.8);



backdrop-filter:blur(10px);



z-index:20;



}




#holdBox{


position:relative;



padding:50px;



border-radius:35px;



background:

linear-gradient(
#222,
#050505
);



border:5px solid gold;



box-shadow:

0 0 60px gold;



overflow:hidden;



}






#holdTitle{


font-size:90px;



font-weight:900;



letter-spacing:12px;



background:

linear-gradient(

white,
gold,
#8fdfff

);



-webkit-background-clip:text;



color:transparent;



text-shadow:

0 0 20px white,
0 0 50px cyan;



animation:

freezeText 2s infinite alternate;


}





@keyframes freezeText{


from{

filter:brightness(.8);

}


to{

filter:brightness(1.5);

}


}





#timer{


margin-top:25px;



font-size:40px;



color:white;


}




.progress{


margin-top:30px;


width:350px;



height:25px;



background:#333;



border:2px solid gold;



border-radius:20px;



overflow:hidden;


}




#progressBar{


height:100%;



width:100%;



background:

linear-gradient(
90deg,
gold,
orange
);


}




#final{


margin-top:30px;



opacity:0;



transition:2s;



color:white;


line-height:1.6;


}




.show{


opacity:1!important;


}






.confetti{


position:fixed;


top:-20px;



width:12px;


height:20px;



animation:

fall 3s linear forwards;


}



@keyframes fall{


to{

transform:

translateY(110vh)
rotate(720deg);


}

}



</style>


</head>



<body>



<div id="ice"></div>




<div class="machine" id="machine">


<h1>
JACKPOT
</h1>



<div class="subtitle">

VARIABLE REWARD

</div>




<div class="display">


<div class="slots">


<div class="slot" id="s1">
🍒
</div>


<div class="slot" id="s2">
⭐
</div>


<div class="slot" id="s3">
💎
</div>



</div>


</div>





<button id="spinBtn">

🎰 SPIN

</button>



<div id="message">

Almost...

</div>



<div id="counter">

Spin: 0 / 100

</div>



<div id="final"></div>



</div>







<div id="holdOverlay">


<div id="holdBox">


<div id="holdTitle">

HOLD

</div>



<div id="timer">

02:00

</div>




<div class="progress">

<div id="progressBar"></div>


</div>




<p style="margin-top:20px;color:#aaa">

Next spins available soon...

</p>



</div>


</div>
<script>


// ===========================
// SETTINGS
// ===========================


const TOTAL_SPINS = 100;

const SESSION_LIMIT = 10;

const HOLD_SECONDS = 120;



// ===========================
// VARIABLES
// ===========================


let totalSpins = 0;

let sessionSpins = 0;

let spinning = false;

let holdActive = false;



// ===========================
// ELEMENTS
// ===========================


const machine =
document.getElementById("machine");


const spinBtn =
document.getElementById("spinBtn");


const slots = [

document.getElementById("s1"),

document.getElementById("s2"),

document.getElementById("s3")

];


const message =
document.getElementById("message");


const counter =
document.getElementById("counter");


const holdOverlay =
document.getElementById("holdOverlay");


const ice =
document.getElementById("ice");


const timer =
document.getElementById("timer");


const progress =
document.getElementById("progressBar");


const final =
document.getElementById("final");




// ===========================
// SYMBOLS
// ===========================


const symbols=[

"🍒",
"🍋",
"⭐",
"💎",
"🔔",
"7️⃣"

];



const messages=[

"Almost...",

"So close...",

"One symbol away",

"Nearly there",

"That was close",

"Maybe next spin",

"The jackpot is waiting",

"Try again",

"Almost perfect",

"Not yet..."

];






// ===========================
// SOUND
// ===========================


function playSound(freq,duration){


let ctx =
new AudioContext();


let osc =
ctx.createOscillator();


let gain =
ctx.createGain();



osc.connect(gain);

gain.connect(
ctx.destination
);



osc.frequency.value=freq;


gain.gain.value=.06;


osc.start();


osc.stop(
ctx.currentTime+duration
);



}






// ===========================
// SAVE GAME
// ===========================


function saveGame(){


localStorage.setItem(

"jackpotSave",

JSON.stringify({

totalSpins:totalSpins,

sessionSpins:sessionSpins

})

);


}






function loadGame(){


let saved =
localStorage.getItem(
"jackpotSave"
);



if(saved){


let data =
JSON.parse(saved);


totalSpins =
data.totalSpins || 0;


sessionSpins =
data.sessionSpins || 0;


}



updateCounter();


}







function updateCounter(){


counter.innerHTML =

`
Spin: ${totalSpins} / ${TOTAL_SPINS}
`;

}







// ===========================
// SPIN BUTTON
// ===========================


spinBtn.onclick=function(){



if(spinning) return;


if(holdActive) return;



if(totalSpins>=TOTAL_SPINS)
return;



if(sessionSpins>=SESSION_LIMIT){


startHold();


return;


}



startSpin();


};









// ===========================
// SPIN
// ===========================


function startSpin(){



spinning=true;



totalSpins++;


sessionSpins++;


updateCounter();


saveGame();


playSound(180,.15);




slots.forEach(slot=>{

slot.classList.add("spin");

});




let count=0;



let animation=setInterval(()=>{


slots.forEach(slot=>{


slot.innerHTML=

symbols[
Math.floor(
Math.random()*symbols.length
)
];


});



count++;



if(count>=20){


clearInterval(animation);



slots.forEach(slot=>{

slot.classList.remove("spin");

});



spinResult();



spinning=false;


}



},100);



}









// ===========================
// RESULT
// ===========================


function spinResult(){



let chance =
Math.random();



if(chance < 0.15){



let near=[


["⭐","⭐","🍋"],


["💎","💎","⭐"],


["7️⃣","7️⃣","🔔"],


["🍒","🍒","💎"]


];



let result =

near[
Math.floor(
Math.random()*near.length
)
];



slots[0].innerHTML=result[0];

slots[1].innerHTML=result[1];

slots[2].innerHTML=result[2];



message.innerHTML=

"🔥 SO CLOSE";



playSound(700,.3);



}

else{


message.innerHTML=

messages[
Math.floor(
Math.random()*messages.length
)
];


}





if(totalSpins>=TOTAL_SPINS){


finishGame();


}



}








// ===========================
// HOLD MODE
// ===========================


function startHold(){



holdActive=true;



spinBtn.disabled=true;



holdOverlay.style.display="flex";



ice.style.display="block";



machine.classList.add("frozen");




let endTime =

Date.now()
+
(HOLD_SECONDS*1000);



localStorage.setItem(

"holdEnd",

endTime

);



startTimer(endTime);



}








function startTimer(endTime){



let timerLoop=setInterval(()=>{



let remaining =

Math.floor(

(endTime-Date.now())
/1000

);



if(remaining<=0){


clearInterval(timerLoop);


endHold();


return;

}




let min =

Math.floor(
remaining/60
);



let sec =

remaining%60;



timer.innerHTML=

`
${min<10?"0":""}${min}:
${sec<10?"0":""}${sec}
`;




progress.style.width=

(
remaining/HOLD_SECONDS*100
)
+
"%";



},1000);



}









function endHold(){


holdActive=false;



sessionSpins=0;



spinBtn.disabled=false;



holdOverlay.style.display="none";


ice.style.display="none";



machine.classList.remove("frozen");



localStorage.removeItem(
"holdEnd"
);



saveGame();



message.innerHTML=
"🎰 READY";


}








// ===========================
// RESTORE HOLD AFTER REFRESH
// ===========================


function restoreHold(){



let saved =

localStorage.getItem(
"holdEnd"
);



if(!saved)
return;



let endTime =
Number(saved);



if(endTime>Date.now()){



holdActive=true;


spinBtn.disabled=true;



holdOverlay.style.display="flex";


ice.style.display="block";



machine.classList.add("frozen");



startTimer(endTime);



}

else{


localStorage.removeItem(
"holdEnd"
);


}



}








// ===========================
// FINAL JACKPOT
// ===========================


function finishGame(){



spinBtn.disabled=true;



slots[0].innerHTML="💰";

slots[1].innerHTML="⭐";

slots[2].innerHTML="💎";



message.innerHTML=

"🎉 JACKPOT 🎉";



playSound(1200,.8);



createConfetti();




setTimeout(()=>{



final.classList.add("show");



final.innerHTML=

`

<h2 style="color:gold">
But why did you keep trying?
</h2>


<br>


You didn't know when the reward would appear.


<br><br>


Every spin created expectation.


<br><br>


The uncertainty kept you engaged.


<br><br>


<b>
You were not chasing the reward.
</b>


<br><br>


You were chasing the possibility of the reward.


<br><br>


This is variable reinforcement.

`;



},2500);



}









// ===========================
// CONFETTI
// ===========================


function createConfetti(){



for(let i=0;i<150;i++){



let piece =
document.createElement("div");



piece.className="confetti";



piece.style.left =
Math.random()*100+"vw";



piece.style.background =

[
"gold",
"red",
"blue",
"green",
"white"

]
[
Math.floor(
Math.random()*5
)
];



document.body.appendChild(piece);



setTimeout(()=>{


piece.remove();


},4000);



}



}






// START GAME


loadGame();


restoreHold();



</script>
