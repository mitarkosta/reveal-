<!DOCTYPE html>
<html lang="bg">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Frozen Jackpot V4</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<style>


/* =====================================
   RESET
===================================== */


*{

margin:0;
padding:0;
box-sizing:border-box;

}



html,
body{


width:100%;

height:100%;


overflow:hidden;


font-family:

Arial,
Helvetica,
sans-serif;



}





body{


display:flex;


justify-content:center;


align-items:center;



color:white;



background:


radial-gradient(

circle at center,

#b00000,

#420000 40%,

#050505 85%

);



position:relative;


}





/* =====================================
   MOVING CASINO LIGHTS
===================================== */


body::before{


content:"";


position:absolute;


inset:-60%;



background:


conic-gradient(

transparent,

rgba(255,215,0,.35),

transparent,

rgba(255,0,0,.35),

transparent,

rgba(0,255,255,.25),

transparent

);



animation:

casinoRotate 15s linear infinite;



}



@keyframes casinoRotate{


from{

transform:

rotate(0deg);

}



to{

transform:

rotate(360deg);

}



}







body::after{


content:"";


position:absolute;


inset:0;



background-image:


radial-gradient(

gold 1px,

transparent 1px

);



background-size:

35px 35px;



opacity:.25;



animation:

starsMove 20s linear infinite;



}



@keyframes starsMove{


from{

background-position:

0 0;

}



to{

background-position:

300px 400px;

}



}









/* =====================================
   MACHINE
===================================== */


.machine{


position:relative;


z-index:5;



width:95%;


max-width:500px;



padding:25px;



background:


linear-gradient(

145deg,

#292929,

#050505

);



border:

5px solid gold;



border-radius:

35px;



text-align:center;



box-shadow:


0 0 30px gold,

0 0 100px orange;



transition:

1s;



}





.machine.frozen{


filter:


brightness(.45)

blur(2px)

saturate(.3);



transform:

scale(.97);



}








/* =====================================
   TITLE
===================================== */


#title{


font-size:


clamp(45px,12vw,75px);



font-weight:

900;



letter-spacing:

6px;



color:

#ffd700;



text-shadow:


0 0 20px gold,

0 0 60px orange;



}





.subtitle{


font-size:14px;


letter-spacing:6px;


color:#ddd;


margin-top:5px;


}









/* =====================================
   DISPLAY
===================================== */


.display{


margin-top:30px;


padding:20px;



background:#000;



border-radius:

25px;



border:

3px solid #555;



box-shadow:


inset 0 0 40px black;



}






.slots{


display:flex;


justify-content:center;


gap:10px;



}








.slot{


width:90px;


height:90px;



display:flex;


justify-content:center;


align-items:center;



font-size:55px;



background:


linear-gradient(

145deg,

#333,

#111

);



border:

3px solid gold;



border-radius:18px;



box-shadow:


0 0 20px gold,

inset 0 0 20px black;



transition:.2s;



}








/* =====================================
   REAL REEL BLUR SPIN
===================================== */


.slot.spinning{


filter:

blur(5px);



animation:


reelBlur .08s infinite linear;



}




@keyframes reelBlur{


0%{


transform:

translateY(-20px)

scaleY(1.2);



}



50%{


transform:

translateY(20px)

scaleY(.8);



}



100%{


transform:

translateY(-20px)

scaleY(1.2);



}



}









/* =====================================
   REEL STOP GLOW
===================================== */


.slot.stopGlow{


animation:

stopFlash .6s ease;



}



@keyframes stopFlash{


0%{


box-shadow:

0 0 10px white;


}



50%{


box-shadow:


0 0 70px gold,

0 0 120px orange;



}



100%{


box-shadow:


0 0 20px gold;



}



}









/* =====================================
   BUTTON
===================================== */


#spinButton{


margin-top:30px;



width:90%;



padding:18px;



font-size:25px;



font-weight:bold;



border:none;



border-radius:50px;



cursor:pointer;



background:


linear-gradient(

gold,

orange

);



color:#222;



box-shadow:


0 0 40px gold;



}





#spinButton:disabled{


opacity:.4;


}







/* =====================================
   TEXT
===================================== */


#message{


margin-top:25px;



font-size:28px;



color:gold;



text-shadow:


0 0 20px gold;



}





#counter{


margin-top:15px;


font-size:18px;


color:#bbb;



}





#finalMessage{


margin-top:25px;


font-size:20px;


line-height:1.6;



opacity:0;


transition:

2s;



}





#finalMessage.show{


opacity:1;


}









/* =====================================
   MOBILE
===================================== */


@media(max-width:600px){



.machine{


width:94vw;


padding:20px;


}



.slot{


width:85px;


height:85px;


font-size:48px;


}



#title{


font-size:45px;


}



}

</style>


</head>


<body>


<!-- =====================================
     BACKGROUND EFFECT LAYERS
===================================== -->


<div id="backgroundLayer"></div>

<div id="iceLayer"></div>

<div id="flashLayer"></div>




<!-- =====================================
     MAIN CASINO MACHINE
===================================== -->


<div class="machine" id="machine">


<h1 id="title">

JACKPOT

</h1>


<div class="subtitle">

FROZEN VARIABLE REWARD

</div>




<!-- =====================================
     SLOT DISPLAY
===================================== -->


<div class="display">


<div class="slots">


<div class="slot" id="slot1">

🍒

</div>


<div class="slot" id="slot2">

⭐

</div>


<div class="slot" id="slot3">

💎

</div>



</div>


</div>






<button id="spinButton">

🎰 SPIN

</button>





<div id="message">

Almost...

</div>





<div id="counter">

Spin: 0 / 100

</div>





<div id="finalMessage">


</div>



</div>










<!-- =====================================
        HOLD FREEZE SCREEN
===================================== -->


<div id="holdOverlay">



<!-- хорър ледена атмосфера -->


<div id="iceFace">


<div class="faceGlow"></div>


<div class="horrorText">

THE MACHINE IS WATCHING...

</div>


</div>







<div id="holdBox">



<div id="holdTitle">

HOLD

</div>





<div id="holdTimer">

02:00

</div>







<div class="progressContainer">


<div id="progressBar">

</div>


</div>






<div id="holdText">


THE MACHINE IS FREEZING...


<br><br>


WAIT FOR NEXT SPINS


</div>



</div>


</div>









<!-- =====================================
        PARTICLE CONTAINERS
===================================== -->


<div id="snowContainer"></div>


<div id="coinContainer"></div>




<!-- =====================================
        JAVASCRIPT PARTS WILL FOLLOW
===================================== -->


</body>

</html>
