========================================= -->


<style>

/* ===============================
 BASE OPTIMIZATION
=============================== */

.slot,
#machine,
.fj-effect,
.fj-coin,
.fj-face,
.fj-snow {

    will-change: transform, opacity;

}


/* ===============================
 MACHINE STATES
=============================== */


.fjFrozen {

    filter:
    brightness(.7)
    hue-rotate(160deg);

    box-shadow:
    0 0 60px cyan,
    0 0 120px blue;

}



.fjReady {

    animation:
    fjReadyPulse 2s infinite alternate;

}



@keyframes fjReadyPulse {

from {

box-shadow:
0 0 20px gold;

}


to {

0 0 70px orange;

}

<script>


// =================================
// FROZEN JACKPOT V6 CORE
// =================================


window.FrozenJackpot = {

    version:"V6",

    locked:false,

    frozen:false,

    jackpot:false,

    totalSpins:0,

    sessionSpins:0

};





// =================================
// GAME SETTINGS
// =================================


window.FJ_CONFIG = {

    TOTAL_SPINS:100,

    SESSION_LIMIT:5,

    HOLD_TIME:120

};







// =================================
// ELEMENT CACHE
// =================================


const FJ = {


machine:
document.getElementById("machine"),



slots:[

document.getElementById("s1"),

document.getElementById("s2"),

document.getElementById("s3")

],



button:
document.getElementById("spinBtn"),



message:
document.getElementById("message"),



counter:
document.getElementById("counter")


};






// =================================
// SYMBOL ENGINE
// =================================


FJ.symbols=[

"🍒",

"🍋",

"⭐",

"💎",

"🔔",

"7️⃣",

"💰"

];






// =================================
// SAVE SYSTEM
// =================================


function saveGame(){


localStorage.setItem(

"FROZEN_JACKPOT_SAVE",

JSON.stringify({

total:
FrozenJackpot.totalSpins,


session:
FrozenJackpot.sessionSpins


})

);


}







function loadGame(){


let data=

localStorage.getItem(
"FROZEN_JACKPOT_SAVE"
);



if(!data)

return;



try{


let save=

JSON.parse(data);



FrozenJackpot.totalSpins=

save.total || 0;



FrozenJackpot.sessionSpins=

save.session || 0;



}

catch(e){


console.log(
"Save reset"
);


}



}








// =================================
// COUNTER
// =================================


function updateCounter(){


if(FJ.counter){


FJ.counter.innerHTML=

FrozenJackpot.totalSpins
+
"/"
+
FJ_CONFIG.TOTAL_SPINS;


}


}








// =================================
// STARTUP
// =================================


loadGame();

updateCounter();



if(FJ.machine){

FJ.machine.classList.add(
"fjReady"
);

}



console.log(
"Frozen Jackpot V6 PART 1 READY"
);



</script>

<script>



// =================================
// FROZEN JACKPOT V6
// PART 2
// SPIN ENGINE
// =================================



const FJ_SPIN_TIME = 3000;




function spinGame(){


if(FrozenJackpot.locked)
return;


if(FrozenJackpot.frozen)
return;


if(FrozenJackpot.jackpot)
return;



FrozenJackpot.locked=true;



FrozenJackpot.totalSpins++;

FrozenJackpot.sessionSpins++;



updateCounter();

saveGame();





FJ.slots.forEach(slot=>{


slot.classList.add("spinning");


});





FJ.message.innerHTML=

"🎰 SPINNING...";






setTimeout(()=>{


FJ.slots.forEach(slot=>{


slot.classList.remove(
"spinning"
);



slot.innerHTML=

FJ.symbols[

Math.floor(
Math.random()*FJ.symbols.length
)

];



});





checkFinalSpin();



FrozenJackpot.locked=false;



},FJ_SPIN_TIME);



}









// =================================
// FINAL 100 SPIN CHECK
// =================================



function checkFinalSpin(){



if(
FrozenJackpot.totalSpins >= 
FJ_CONFIG.TOTAL_SPINS
){


startFinalJackpot();


}

else{


FJ.message.innerHTML=

"🎰 KEEP PLAYING";


}



}









// =================================
// BUTTON
// =================================



if(FJ.button){


FJ.button.onclick=function(){



if(
FrozenJackpot.sessionSpins >=
FJ_CONFIG.SESSION_LIMIT
){


startHold();


return;


}



spinGame();



};



}








console.log(
"Frozen Jackpot V6 PART 2 READY"
);



</script>

<script>



// =================================
// HOLD ENGINE
// =================================


let fjHoldTimer=null;



function startHold(){



if(FrozenJackpot.frozen)
return;



FrozenJackpot.frozen=true;



if(FJ.machine){

FJ.machine.classList.add(
"fjFrozen"
);

}



if(FJ.button){

FJ.button.disabled=true;

}





FJ.message.innerHTML=

"❄️ MACHINE FROZEN - JACKPOT PAUSE ❄️";







createIceWorld();





let end=

Date.now()

+

(FJ_CONFIG.HOLD_TIME*1000);





fjHoldTimer=setInterval(()=>{



let left=

Math.floor(

(end-Date.now())/1000

);



if(left<=0){


endHold();


}



},1000);





}









// =================================
// CREATE ICE SCENE
// =================================



function createIceWorld(){



let ice=

document.createElement("div");

ice.className="fjIceWorld";

ice.id="fjIce";

document.body.appendChild(ice);





let frost=

document.createElement("div");

frost.className="fjFrost";

frost.id="fjFrost";

document.body.appendChild(frost);







// FACE


let face=

document.createElement("div");

face.className="fjFace";

face.id="fjFace";


face.innerHTML="❄️";


document.body.appendChild(face);







// ICICLES


for(let i=0;i<18;i++){



let icicle=

document.createElement("div");



icicle.className="fjIcicle";



icicle.style.left=

Math.random()*100+"%";



icicle.style.height=

(40+Math.random()*120)+"px";



document.body.appendChild(icicle);



}








// SNOW


for(let i=0;i<80;i++){



let snow=

document.createElement("div");

snow.className="fjSnow";


snow.innerHTML="❄";



snow.style.left=

Math.random()*100+"vw";



snow.style.animationDuration=

(5+Math.random()*8)+"s";



document.body.appendChild(snow);



}




}









// =================================
// END HOLD
// =================================



function endHold(){



clearInterval(
fjHoldTimer
);



FrozenJackpot.frozen=false;



FrozenJackpot.sessionSpins=0;



if(FJ.machine){

FJ.machine.classList.remove(
"fjFrozen"
);

}



if(FJ.button){

FJ.button.disabled=false;

}





document
.querySelectorAll(
"#fjIce,.fjFrost,.fjFace,.fjIcicle,.fjSnow"
)
.forEach(e=>e.remove());




FJ.message.innerHTML=

"🎰 READY FOR SPIN";



saveGame();



}








console.log(
"Frozen Jackpot V6 PART 3 ICE WORLD READY"
);



</script>

<script>


// =================================
// FROZEN JACKPOT V6
// PART 5
// OPTIMIZATION SYSTEM
// =================================







// =================================
// MOBILE DETECTION
// =================================


const FJ_MOBILE_MODE =

window.innerWidth < 600;





if(FJ_MOBILE_MODE){


document.body.classList.add(
"fjMobileLow"
);


}









// =================================
// SAFE VIBRATION
// =================================



function fjVibrate(power=50){



if(
navigator.vibrate
){


navigator.vibrate(power);


}



}









// =================================
// ADD SPIN FEEDBACK
// =================================



const oldSpinGame = spinGame;



spinGame=function(){



fjVibrate(40);



oldSpinGame();



};









// =================================
// JACKPOT FEEDBACK
// =================================



const oldFinalJackpot =
startFinalJackpot;



startFinalJackpot=function(){



fjVibrate(

[
100,
50,
200,
50,
500
]

);



oldFinalJackpot();



};









// =================================
// CLEAN EFFECT MEMORY
// =================================



function cleanFJEffects(){



document
.querySelectorAll(

".fjCoin,.fjSnow,.fjIcicle"

)

.forEach(el=>{


if(
el.getBoundingClientRect().top >
window.innerHeight*2
){


el.remove();


}



});



}






setInterval(

cleanFJEffects,

5000

);









// =================================
// AUDIO ENGINE
// =================================



let fjAudio=null;





function fjAudioInit(){



if(!fjAudio){


fjAudio=

new AudioContext();


}



if(
fjAudio.state==="suspended"
){


fjAudio.resume();


}



}









function fjSound(
freq,
time
){



fjAudioInit();



let osc=

fjAudio.createOscillator();



let gain=

fjAudio.createGain();



osc.frequency.value=freq;



gain.gain.value=.05;



osc.connect(gain);


gain.connect(
fjAudio.destination
);



osc.start();



osc.stop(

fjAudio.currentTime+time

);



}








// =================================
// SPIN SOUND
// =================================



function spinClickSound(){



fjSound(
180,
0.08
);



setTimeout(()=>{


fjSound(
260,
0.08
);



},100);



}









// =================================
// FINAL JACKPOT SOUND
// =================================



function jackpotSound(){



fjSound(
600,
0.2
);



setTimeout(()=>{


fjSound(
900,
0.3
);



},200);



setTimeout(()=>{


fjSound(
1400,
0.5
);



},500);



}









// =================================
// CONNECT SOUNDS
// =================================



const oldSpin =
spinGame;



spinGame=function(){


spinClickSound();


oldSpin();


};







const oldJackpot =
startFinalJackpot;



startFinalJackpot=function(){


jackpotSound();


oldJackpot();


};









console.log(

"Frozen Jackpot V6 PART 5 OPTIMIZED READY"

);



</script>
