<!DOCTYPE html>
<html lang="bg">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frozen Jackpot</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}



body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;


font-family:Arial, sans-serif;



background:

radial-gradient(
circle,
#700000,
#080808 80%
);



color:white;

}





/* Златни частици на фона */


body::before{


content:"";


position:absolute;


inset:0;


background-image:


radial-gradient(
gold 1px,
transparent 1px
);



background-size:40px 40px;


opacity:.18;


animation:

backgroundMove 20s linear infinite;


}





@keyframes backgroundMove{


from{

transform:translateY(0);

}


to{

transform:translateY(100px);

}


}






/* =========================
   SLOT MACHINE
========================= */



.machine{


position:relative;


z-index:3;



width:95%;

max-width:700px;



padding:45px;



background:


linear-gradient(
145deg,
#222,
#050505
);



border:5px solid gold;



border-radius:40px;



text-align:center;



box-shadow:



0 0 40px gold,

0 0 120px orange;



transition:1.5s;


}





.machine.frozen{


filter:

blur(3px)
brightness(.5)
saturate(.3);



transform:scale(.98);



}




h1{


font-size:70px;



font-weight:900;



color:#ffd700;



text-shadow:


0 0 20px gold,

0 0 60px orange;


}





.subtitle{


margin-top:10px;


font-size:18px;


letter-spacing:8px;


color:#ddd;


}






.display{


margin-top:40px;



padding:30px;



background:#000;



border-radius:25px;



border:3px solid #777;



box-shadow:


inset 0 0 40px black;


}







.slots{


display:flex;


justify-content:center;


gap:20px;


}




.slot{


height:120px;


width:120px;



display:flex;


align-items:center;


justify-content:center;



font-size:70px;



background:

linear-gradient(
145deg,
#333,
#111
);



border:

4px solid gold;



border-radius:20px;



box-shadow:


inset 0 0 25px black,

0 0 20px rgba(255,215,0,.5);



}




.spin{


animation:

spinMove .12s infinite;


}




@keyframes spinMove{


50%{

transform:

translateY(20px);


}

}





button{


margin-top:40px;



padding:22px 70px;



font-size:30px;



font-weight:bold;



border:none;



border-radius:60px;



cursor:pointer;



background:


linear-gradient(
gold,
#d88900
);



box-shadow:


0 0 35px gold;


}




button:disabled{


opacity:.4;


}




#message{


margin-top:30px;


font-size:35px;


color:gold;


text-shadow:

0 0 15px gold;


}




#counter{


margin-top:15px;


color:#aaa;


font-size:20px;


}







/* =========================
   ICE LAYER
========================= */


#ice{


display:none;


position:fixed;


z-index:10;


inset:0;


pointer-events:none;



background:


radial-gradient(

circle,

transparent 45%,

rgba(150,230,255,.35) 75%,

rgba(255,255,255,.85)

);



box-shadow:



inset 0 0 120px 60px #b9efff;



animation:


icePulse 3s infinite alternate;



}





@keyframes icePulse{


from{

opacity:.5;

}



to{

opacity:1;

}


}






#ice::before{


content:"";


position:absolute;


inset:0;



background:


linear-gradient(

120deg,

transparent,

rgba(255,255,255,.7),

transparent

);



animation:


iceMove 5s infinite;


}



@keyframes iceMove{


from{

transform:translateX(-100%);

}


to{

transform:translateX(100%);

}


}






#ice::after{


content:


"❄  ❄   ❄    ❄     ❄";



position:absolute;


top:-50px;


left:0;



width:100%;



font-size:60px;


color:white;



opacity:.5;



letter-spacing:80px;



animation:


snowFall 8s linear infinite;


}




@keyframes snowFall{


to{

transform:

translateY(120vh);


}


}
