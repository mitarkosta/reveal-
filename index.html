<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Almost...</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(circle at top,#3b0000,#080808 70%);

    font-family:Arial,Helvetica,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;

    overflow:hidden;
}

/* Звездички */

body::before{

content:"";

position:absolute;

width:200%;
height:200%;

background-image:
radial-gradient(gold 1px, transparent 1px);

background-size:45px 45px;

opacity:.12;

animation:move 30s linear infinite;

}

@keyframes move{

from{transform:translate(0,0);}
to{transform:translate(-200px,-200px);}

}

/* Основна карта */

.card{

position:relative;

background:#111;

padding:60px;

border-radius:25px;

border:4px solid gold;

box-shadow:

0 0 25px gold,
0 0 60px rgba(255,215,0,.4);

text-align:center;

z-index:2;

}

/* JACKPOT */

h1{

font-size:70px;

color:gold;

text-shadow:

0 0 10px gold,
0 0 20px orange,
0 0 40px orange;

animation:pulse 1.5s infinite;

}

@keyframes pulse{

50%{

transform:scale(1.05);

text-shadow:

0 0 15px gold,
0 0 30px orange,
0 0 60px orange;

}

}

.subtitle{

margin-top:15px;

font-size:24px;

color:white;

letter-spacing:4px;

}

/* Съобщение */

#message{

margin-top:45px;

font-size:40px;

font-weight:bold;

height:60px;

color:#ffdf5d;

transition:.4s;

text-shadow:0 0 15px gold;

}

/* Бутон */

button{

margin-top:40px;

padding:20px 60px;

font-size:28px;

font-weight:bold;

border:none;

border-radius:60px;

cursor:pointer;

background:linear-gradient(gold,#d99b00);

color:#111;

box-shadow:

0 0 20px gold;

transition:.25s;

}

button:hover{

transform:scale(1.08);

box-shadow:

0 0 35px gold,
0 0 60px orange;

}

button:active{

transform:scale(.95);

}

/* Финално съобщение */

#final{

margin-top:35px;

font-size:22px;

line-height:1.6;

color:white;

opacity:0;

transition:1s;

max-width:700px;

}

.show{

opacity:1 !important;

}

</style>

</head>

<body>

<div class="card">

<h1>JACKPOT</h1>

<div class="subtitle">
TRY YOUR LUCK
</div>

<div id="message">
✨ Almost... ✨
</div>

<button onclick="clickMe()">
🎰 REVEAL
</button>

<div id="final"></div>

</div>

<script>

let clicks=0;

const message=document.getElementById("message");
const final=document.getElementById("final");

function clickMe(){

clicks++;

const btn=document.querySelector("button");

btn.style.transform="scale(.93)";

setTimeout(()=>{
btn.style.transform="";
},120);

if(clicks===1){

message.innerHTML="❌ Not yet.";

}

else if(clicks===2){

message.innerHTML="❌ Still not.";

}

else if(clicks===3){

message.innerHTML="⭐ Almost...";

}

else if(clicks===4){

message.innerHTML="🎲 One more try...";

}

else{

message.innerHTML="💰 Come back later.";

btn.disabled=true;

btn.style.opacity=.6;

setTimeout(()=>{

final.classList.add("show");

final.innerHTML=`

<h2 style="color:gold;margin-bottom:20px;">
Why did you keep clicking?
</h2>

You expected a reward.

<br><br>

That expectation kept you engaged...

<br><br>

<b>This is an example of variable reinforcement.</b>

`;

},2000);

}

}

</script>

</body>
</html>
