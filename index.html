<!DOCTYPE html>
<html lang="bg">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frozen Jackpot</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}



body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;


font-family:Arial, sans-serif;



background:

radial-gradient(
circle,
#700000,
#080808 80%
);



color:white;

}





/* Златни частици на фона */


body::before{


content:"";


position:absolute;


inset:0;


background-image:


radial-gradient(
gold 1px,
transparent 1px
);



background-size:40px 40px;


opacity:.18;


animation:

backgroundMove 20s linear infinite;


}





@keyframes backgroundMove{


from{

transform:translateY(0);

}


to{

transform:translateY(100px);

}


}






/* =========================
   SLOT MACHINE
========================= */



.machine{


position:relative;


z-index:3;



width:95%;

max-width:700px;



padding:45px;



background:


linear-gradient(
145deg,
#222,
#050505
);



border:5px solid gold;



border-radius:40px;



text-align:center;



box-shadow:



0 0 40px gold,

0 0 120px orange;



transition:1.5s;


}





.machine.frozen{


filter:

blur(3px)
brightness(.5)
saturate(.3);



transform:scale(.98);



}




h1{


font-size:70px;



font-weight:900;



color:#ffd700;



text-shadow:


0 0 20px gold,

0 0 60px orange;


}





.subtitle{


margin-top:10px;


font-size:18px;


letter-spacing:8px;


color:#ddd;


}






.display{


margin-top:40px;



padding:30px;



background:#000;



border-radius:25px;



border:3px solid #777;



box-shadow:


inset 0 0 40px black;


}







.slots{


display:flex;


justify-content:center;


gap:20px;


}




.slot{


height:120px;


width:120px;



display:flex;


align-items:center;


justify-content:center;



font-size:70px;



background:

linear-gradient(
145deg,
#333,
#111
);



border:

4px solid gold;



border-radius:20px;



box-shadow:


inset 0 0 25px black,

0 0 20px rgba(255,215,0,.5);



}




.spin{


animation:

spinMove .12s infinite;


}




@keyframes spinMove{


50%{

transform:

translateY(20px);


}

}





button{


margin-top:40px;



padding:22px 70px;



font-size:30px;



font-weight:bold;



border:none;



border-radius:60px;



cursor:pointer;



background:


linear-gradient(
gold,
#d88900
);



box-shadow:


0 0 35px gold;


}




button:disabled{


opacity:.4;


}




#message{


margin-top:30px;


font-size:35px;


color:gold;


text-shadow:

0 0 15px gold;


}




#counter{


margin-top:15px;


color:#aaa;


font-size:20px;


}







/* =========================
   ICE LAYER
========================= */


#ice{


display:none;


position:fixed;


z-index:10;


inset:0;


pointer-events:none;



background:


radial-gradient(

circle,

transparent 45%,

rgba(150,230,255,.35) 75%,

rgba(255,255,255,.85)

);



box-shadow:



inset 0 0 120px 60px #b9efff;



animation:


icePulse 3s infinite alternate;



}





@keyframes icePulse{


from{

opacity:.5;

}



to{

opacity:1;

}


}






#ice::before{


content:"";


position:absolute;


inset:0;



background:


linear-gradient(

120deg,

transparent,

rgba(255,255,255,.7),

transparent

);



animation:


iceMove 5s infinite;


}



@keyframes iceMove{


from{

transform:translateX(-100%);

}


to{

transform:translateX(100%);

}


}






#ice::after{


content:


"❄  ❄   ❄    ❄     ❄";



position:absolute;


top:-50px;


left:0;



width:100%;



font-size:60px;


color:white;



opacity:.5;



letter-spacing:80px;



animation:


snowFall 8s linear infinite;


}




@keyframes snowFall{


to{

transform:

translateY(120vh);


}


}
/* =========================
   HOLD FREEZE SCREEN
========================= */


#holdOverlay{


position:fixed;


inset:0;



display:none;



justify-content:center;


align-items:center;



z-index:20;



background:

rgba(0,0,0,.85);



backdrop-filter:

blur(12px);


}





#holdBox{


position:relative;



width:500px;



padding:55px;



text-align:center;



background:


linear-gradient(

145deg,

#222,

#050505

);



border:

5px solid gold;



border-radius:40px;



overflow:hidden;



box-shadow:


0 0 50px gold,

0 0 100px cyan;



animation:


holdBoxFreeze 2s infinite alternate;



}







@keyframes holdBoxFreeze{


from{


box-shadow:


0 0 40px gold,

0 0 70px cyan;



}



to{


box-shadow:


0 0 80px white,

0 0 140px #80eaff;



}


}







/* ледена рамка около HOLD */


#holdBox::before{


content:"";


position:absolute;


inset:-10px;



border-radius:50px;



background:


linear-gradient(

45deg,

transparent,

#bff7ff,

transparent

);



animation:


iceBorder 4s linear infinite;


opacity:.7;


}



@keyframes iceBorder{


from{

transform:rotate(0deg);

}



to{

transform:rotate(360deg);

}



}








/* =========================
   HOLD TITLE
========================= */



#holdTitle{


position:relative;



font-size:100px;



font-weight:900;



letter-spacing:15px;



background:


linear-gradient(

180deg,

white,

#fff,

gold,

#7fe9ff

);



-webkit-background-clip:text;



color:transparent;



text-shadow:


0 0 10px white,


0 0 30px cyan,


0 0 60px gold;



animation:


freezeTitle 2s infinite alternate;



}




@keyframes freezeTitle{


from{


filter:

brightness(.8);



transform:

scale(1);


}



to{


filter:

brightness(1.5);



transform:

scale(1.04);



}


}






/* движещ се лед върху HOLD */


#holdTitle::after{


content:"";


position:absolute;



top:0;


left:-120%;



width:60%;



height:100%;



background:


linear-gradient(

90deg,

transparent,

rgba(255,255,255,.9),

transparent

);



animation:


titleIceSweep 3s infinite;



}



@keyframes titleIceSweep{


to{


left:160%;


}



}






/* =========================
   TIMER
========================= */


#timer{


margin-top:30px;



font-size:50px;



font-weight:bold;



color:white;



text-shadow:


0 0 20px cyan;



}







/* =========================
   PROGRESS BAR
========================= */



.progress{


margin:35px auto 0;



height:30px;



width:380px;



background:#111;



border-radius:30px;



border:3px solid gold;



overflow:hidden;



box-shadow:


0 0 20px gold;



}




#progressBar{


height:100%;



width:100%;



background:


linear-gradient(

90deg,

gold,

orange,

white

);



transition:

width 1s linear;



}







/* =========================
   HOLD TEXT
========================= */


.holdText{


margin-top:25px;



color:#aaa;



font-size:18px;



letter-spacing:3px;



}








/* =========================
   FINAL MESSAGE
========================= */


#final{


margin-top:40px;



opacity:0;



transition:

2s;



font-size:24px;



line-height:1.7;



color:white;


}



#final.show{


opacity:1;



}






/* =========================
   CONFETTI
========================= */



.confetti{


position:fixed;



top:-20px;



width:15px;



height:25px;



z-index:50;



animation:


fall 4s linear forwards;



}



@keyframes fall{


to{


transform:


translateY(110vh)

rotate(720deg);



}



}








/* =========================
   ICE CRYSTALS
========================= */



.crystal{


position:absolute;



color:white;



font-size:30px;



opacity:.8;



animation:


crystalPulse 2s infinite alternate;



}



@keyframes crystalPulse{


from{

opacity:.4;

}



to{

opacity:1;

}


}
