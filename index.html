<!DOCTYPE html>
<html lang="bg">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Almost Jackpot</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    height:100vh;

    background:
    radial-gradient(circle,#450000,#080808 70%);

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;

    overflow:hidden;
}


/* движещи се светлинки */

body:before{

content:"";

position:absolute;

inset:0;

background-image:
radial-gradient(gold 1px, transparent 1px);

background-size:40px 40px;

opacity:.15;

animation:bgmove 20s linear infinite;

}

@keyframes bgmove{

from{
transform:translateY(0);
}

to{
transform:translateY(100px);
}

}


/* основен прозорец */

.machine{

position:relative;

z-index:2;

background:#111;

padding:40px;

border-radius:25px;

border:5px solid gold;

text-align:center;

box-shadow:

0 0 30px gold,
0 0 80px orange;

max-width:500px;

width:90%;

}


/* заглавие */

h1{

font-size:55px;

color:#ffd700;

text-shadow:

0 0 10px gold,
0 0 30px orange;

animation:glow 1.5s infinite alternate;

}


@keyframes glow{

from{
filter:brightness(1);
}

to{
filter:brightness(1.5);
}

}


.subtitle{

color:white;

letter-spacing:5px;

margin-top:10px;

}


/* слот прозорец */

.slots{

display:flex;

justify-content:center;

gap:15px;

margin:40px 0;

}


.slot{

background:#222;

border:3px solid gold;

border-radius:15px;

width:90px;

height:90px;

display:flex;

align-items:center;

justify-content:center;

font-size:50px;

box-shadow:

inset 0 0 20px black,
0 0 20px gold;

}


/* въртене */

.spin{

animation:spin .15s infinite;

}


@keyframes spin{

0%{
transform:translateY(-10px);
}

50%{
transform:translateY(10px);
}

100%{
transform:translateY(-10px);
}

}



/* бутон */

button{

background:linear-gradient(#ffd700,#d18b00);

border:none;

padding:20px 50px;

font-size:25px;

font-weight:bold;

border-radius:50px;

cursor:pointer;

box-shadow:

0 0 20px gold;

transition:.3s;

}


button:hover{

transform:scale(1.1);

box-shadow:

0 0 40px gold;

}


button:disabled{

opacity:.5;

}


/* съобщение */

#message{

margin-top:30px;

font-size:30px;

color:white;

min-height:40px;

text-shadow:0 0 15px gold;

}


#story{

margin-top:30px;

font-size:20px;

line-height:1.5;

color:white;

opacity:0;

transition:2s;

}


.show{

opacity:1 !important;

}

</style>

</head>


<body>


<div class="machine">


<h1>JACKPOT</h1>

<div class="subtitle">
TRY YOUR LUCK
</div>


<div class="slots">

<div class="slot" id="slot1">🍒</div>

<div class="slot" id="slot2">⭐</div>

<div class="slot" id="slot3">💎</div>

</div>



<button onclick="spin()">
🎰 SPIN
</button>


<div id="message">
Almost...
</div>


<div id="story"></div>


</div>



<script>


let attempts=0;


const symbols=[
"🍒",
"🍋",
"⭐",
"💎",
"7️⃣"
];


function randomSymbol(){

return symbols[
Math.floor(Math.random()*symbols.length)
];

}



function spin(){


attempts++;


let slots=[
document.getElementById("slot1"),
document.getElementById("slot2"),
document.getElementById("slot3")
];


let message=document.getElementById("message");


let button=document.querySelector("button");



slots.forEach(s=>{

s.classList.add("spin");

});



let rounds=15;

let counter=0;



let interval=setInterval(()=>{


slots.forEach(s=>{

s.innerHTML=randomSymbol();

});


counter++;


if(counter>=rounds){


clearInterval(interval);


slots.forEach(s=>{

s.classList.remove("spin");

});


finish(slots,message,button);


}


},100);



}



function finish(slots,message,button){



if(attempts<3){


message.innerHTML="❌ Not this time...";

return;

}



if(attempts===3){


slots[0].innerHTML="⭐";

slots[1].innerHTML="⭐";

slots[2].innerHTML="💎";


message.innerHTML=
"🔥 ALMOST WIN!";


return;

}




button.disabled=true;


slots[0].innerHTML="⭐";

slots[1].innerHTML="⭐";

slots[2].innerHTML="💎";


message.innerHTML=
"🎲 So close...";



setTimeout(()=>{


document.getElementById("story").classList.add("show");


document.getElementById("story").innerHTML=

`
<h2 style="color:#ffd700">
Why did you want to try again?
</h2>

<br>

You were close.

<br><br>

Your brain expected a reward.

<br><br>

The uncertainty kept you engaged.

<br><br>

<b>
This is variable reinforcement.
</b>
`;

},2000);



}



</script>


</body>

</html>
