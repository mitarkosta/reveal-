/* ==========================
RESET
========================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,body{

width:100%;
height:100%;

overflow:hidden;

font-family:
Arial,
Helvetica,
sans-serif;

}


/* ==========================
MOBILE PORTRAIT BASE
========================== */


body{

display:flex;

justify-content:center;

align-items:center;

position:relative;

color:white;


background:

radial-gradient(
circle at center,
#990000,
#350000 45%,
#050505 90%
);


}



/* ==========================
FESTIVAL BACKGROUND
========================== */


body::before{

content:"";

position:absolute;

inset:-50%;


background:

conic-gradient(

transparent,

rgba(255,215,0,.45),

transparent,

rgba(255,0,80,.35),

transparent,

rgba(0,220,255,.35),

transparent

);



animation:

festivalSpin 12s linear infinite;


}




@keyframes festivalSpin{


from{

transform:rotate(0deg);

}


to{

transform:rotate(360deg);

}


}





body::after{

content:"";


position:absolute;

inset:0;



background-image:

radial-gradient(
gold 1px,
transparent 1px
);



background-size:

35px 35px;



opacity:.25;



animation:

starsMove 15s linear infinite;


}




@keyframes starsMove{


from{

background-position:

0 0;

}


to{

background-position:

250px 350px;

}


}

MAIN MACHINE
========================== */


.machine{

z-index:5;

0 0 35px gold,

.machine.frozen{

}

TITLE
========================== */

5px;

========================== */


.display{

padding:20px;



background:

border-radius:25px;



border:

3px solid #555;

inset 0 0 40px black;



}





.slots{

justify-content:center;

}

height:90px;

linear-gradient(

145deg,

#333,

#111

3px solid gold;



border-radius:18px;



box-shadow:


0 0 20px gold,

inset 0 0 20px black;

}

REEL BLUR SPIN
========================== */


.slot.spinning{

blur(5px);



animation:

reelBlur .08s infinite linear;


}




@keyframes reelBlur{


0%{

transform:

translateY(-20px)
scaleY(1.2);

}



50%{

transform:

translateY(20px)
scaleY(.8);

}



100%{

transform:

translateY(-20px)
scaleY(1.2);

}


}

BUTTON
========================== */

padding:18px;

orange

box-shadow:


0 0 40px gold;
