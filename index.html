<!-- =========================================
 FROZEN JACKPOT V8
 PART 1 / CORE ENGINE
 ПОСТАВИ ПЪРВИ
========================================= -->


<style>

#machine,
.slot,
.fjCoin,
.fjSnow,
.fjEffect,
.fjFace {

    will-change: transform, opacity;
    transform: translateZ(0);

}


/* готовност */

.fjReady {

    box-shadow:
    0 0 30px gold,
    0 0 80px orange;

}


/* замръзване */

.fjFrozen {

    filter:
    brightness(.65)
    hue-rotate(170deg);


    box-shadow:

    0 0 80px cyan,
    0 0 180px blue;

}



</style>



<script>


// =================================
// FROZEN JACKPOT V8 CORE
// =================================


window.FrozenJackpot = {


    version:"V8",


    locked:false,


    frozen:false,


    jackpot:false,


    totalSpins:0,


    sessionSpins:0


};






// =================================
// SETTINGS
// =================================


window.FJ_CONFIG = {


    TOTAL_SPINS:100,


    SESSION_LIMIT:5,


    HOLD_TIME:120


};







// =================================
// ELEMENTS
// =================================


window.FJ = {


    machine:
    document.getElementById("machine"),



    slots:[

    document.getElementById("s1"),

    document.getElementById("s2"),

    document.getElementById("s3")

    ],



    button:
    document.getElementById("spinBtn"),



    message:
    document.getElementById("message"),



    counter:
    document.getElementById("counter")


};








// =================================
// SYMBOLS
// =================================


FJ.symbols=[


"🍒",

"🍋",

"⭐",

"💎",

"🔔",

"7️⃣",

"💰"


];








// =================================
// SAVE
// =================================


function fjSave(){


localStorage.setItem(

"FJ_V8_SAVE",


JSON.stringify({

total:
FrozenJackpot.totalSpins,


session:
FrozenJackpot.sessionSpins


})


);


}








function fjLoad(){


let data =

localStorage.getItem(
"FJ_V8_SAVE"
);



if(!data)

return;



try{


let save=

JSON.parse(data);



FrozenJackpot.totalSpins=

save.total || 0;



FrozenJackpot.sessionSpins=

save.session || 0;



}

catch(e){


console.log(
"FJ SAVE RESET"
);


}



}









// =================================
// COUNTER
// =================================


function fjUpdateCounter(){


if(FJ.counter){


FJ.counter.innerHTML =


FrozenJackpot.totalSpins

+

"/"

+

FJ_CONFIG.TOTAL_SPINS;



}


}









// =================================
// MESSAGE
// =================================


function fjMessage(text){


if(FJ.message){


FJ.message.innerHTML=text;


}


}









// =================================
// START
// =================================


fjLoad();


fjUpdateCounter();



if(FJ.machine){


FJ.machine.classList.add(
"fjReady"
);


}



console.log(
"❄️ FROZEN JACKPOT V8 PART 1 READY"
);



</script>
