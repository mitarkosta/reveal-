 <!-- =========================================
     PART 3 / JAVASCRIPT CORE ENGINE

<script>


// =========================================
// SETTINGS
// =========================================


const TOTAL_SPINS = 100;

const SESSION_LIMIT = 10;

const HOLD_TIME = 120;



// =========================================
// GAME VARIABLES
// =========================================


let totalSpins = 0;

let sessionSpins = 0;

let spinning = false;

let holdActive = false;





// =========================================
// ELEMENTS
// =========================================


const machine =
document.getElementById("machine");


const spinBtn =
document.getElementById("spinBtn");


const slots = [

document.getElementById("s1"),

document.getElementById("s2"),

document.getElementById("s3")

];


const message =
document.getElementById("message");


const counter =
document.getElementById("counter");


const ice =
document.getElementById("ice");


const holdOverlay =
document.getElementById("holdOverlay");


const timer =
document.getElementById("timer");


const progressBar =
document.getElementById("progressBar");


const final =
document.getElementById("final");







// =========================================
// SYMBOL DATABASE
// =========================================


const symbols = [


"🍒",

"🍋",

"⭐",

"💎",

"🔔",

"7️⃣",

"💰"


];






const messages=[


"Almost...",


"So close...",


"One more try...",


"The jackpot is warming up...",


"Nearly there...",


"Not yet...",


"The machine feels lucky...",


"Maybe next spin...",


"Almost perfect..."



];








// =========================================
// AUDIO ENGINE
// =========================================


let audioContext;



function getAudio(){


if(!audioContext){


audioContext =
new AudioContext();


}



return audioContext;


}






function tone(freq,duration,type="sine"){



let ctx=getAudio();


let osc =
ctx.createOscillator();


let gain =
ctx.createGain();



osc.type=type;


osc.frequency.value=freq;



gain.gain.value=.07;



osc.connect(gain);

gain.connect(
ctx.destination
);



osc.start();



osc.stop(

ctx.currentTime+duration

);



}








function spinSound(){


tone(180,.12,"square");


setTimeout(()=>{


tone(240,.12,"square");


},120);



}







function reelStopSound(){


tone(600,.15,"triangle");


}






function freezeSound(){



tone(900,.3,"sawtooth");



setTimeout(()=>{


tone(450,.5,"sine");


},300);



}







function jackpotSound(){



tone(700,.2,"square");



setTimeout(()=>{


tone(1000,.3,"square");


},200);



setTimeout(()=>{


tone(1400,.6,"triangle");


},500);



}








// =========================================
// SAVE SYSTEM
// =========================================


function saveGame(){



localStorage.setItem(

"FrozenJackpotFinal",

JSON.stringify({

totalSpins,

sessionSpins

})

);



}








function loadGame(){



let data =

localStorage.getItem(

"FrozenJackpotFinal"

);



if(data){



let game =

JSON.parse(data);



totalSpins =

game.totalSpins || 0;



sessionSpins =

game.sessionSpins || 0;



}



updateCounter();


}







function updateCounter(){



counter.innerHTML =


`

Spin: ${totalSpins} / ${TOTAL_SPINS}

`;



}







// =========================================
// PHONE VIBRATION
// =========================================


function phoneVibrate(){



if(navigator.vibrate){



navigator.vibrate(50);



}



machine.classList.add(
"vibrate"
);



setTimeout(()=>{


machine.classList.remove(
"vibrate"
);


},200);



}








// =========================================
// BUTTON CONTROL
// =========================================


spinBtn.onclick=function(){



if(spinning)

return;



if(holdActive)

return;



if(totalSpins>=TOTAL_SPINS)

return;



if(sessionSpins>=SESSION_LIMIT){


startHold();


return;


}



startSpin();



};







// =========================================
// MAIN SPIN ENGINE
// =========================================


function startSpin(){



spinning=true;



totalSpins++;

sessionSpins++;



updateCounter();


saveGame();



spinSound();


phoneVibrate();




slots.forEach(slot=>{


slot.classList.add(
"spinning"
);


});






let duration=900;



slots.forEach((slot,index)=>{



setTimeout(()=>{



slot.classList.remove(
"spinning"
);



slot.classList.add(
"stopGlow"
);



slot.innerHTML =


symbols[

Math.floor(

Math.random()*symbols.length

)

];



reelStopSound();




setTimeout(()=>{


slot.classList.remove(
"stopGlow"
);



},700);





},duration+(index*500));



});







setTimeout(()=>{



finishSpin();


spinning=false;



},2600);



}





// =========================================
// RESULT CHECK
// =========================================


function finishSpin(){



let chance=Math.random();




if(chance<0.20){



let near=[


["⭐","⭐","🍋"],


["💎","💎","⭐"],


["7️⃣","7️⃣","🔔"],


["🍒","🍒","💎"],


["💰","💰","⭐"]


];



let combo=

near[

Math.floor(

Math.random()*near.length

)

];



slots[0].innerHTML=combo[0];

slots[1].innerHTML=combo[1];

slots[2].innerHTML=combo[2];



message.innerHTML=

"🔥 SO CLOSE";


nearMiss();



}

else{


message.innerHTML=

messages[

Math.floor(

Math.random()*messages.length

)

];



}




// всеки 5 спина антиципация


if(totalSpins%5===0){


anticipation();


}




if(sessionSpins>=SESSION_LIMIT){



setTimeout(()=>{


startHold();


},1000);



}



if(totalSpins>=TOTAL_SPINS){


completeGame();


}



}


<!-- =========================================
     PART 4 / HOLD MODE + SNOW + FREEZE ENGINE
     КОПИРАЙ СЛЕД PART 3
========================================= -->


<script>


// =========================================
// SNOW GENERATOR
// =========================================


function createSnow(){



for(let i=0;i<80;i++){



let snow =
document.createElement("div");



snow.className="snowflake";


snow.innerHTML="❄";



snow.style.left =

Math.random()*100+"vw";



snow.style.fontSize =

(15+Math.random()*25)+"px";



snow.style.animationDuration =

(4+Math.random()*8)+"s";



snow.style.animationDelay =

Math.random()*5+"s";



document.body.appendChild(snow);



}



}






function removeSnow(){



document

.querySelectorAll(".snowflake")

.forEach(s=>{


s.remove();


});



}









// =========================================
// HOLD START
// =========================================


function startHold(){



holdActive=true;


spinBtn.disabled=true;



holdOverlay.style.display="flex";


ice.style.display="block";



machine.classList.add(
"frozen"
);





freezeSound();



createSnow();




let end =

Date.now()

+

HOLD_TIME*1000;





localStorage.setItem(

"FrozenHoldEnd",

end

);





runHoldTimer(end);



}









// =========================================
// HOLD TIMER
// =========================================


function runHoldTimer(end){



let timerLoop =

setInterval(()=>{



let remaining =

Math.floor(

(end-Date.now())

/1000

);





if(remaining<=0){



clearInterval(timerLoop);



endHold();


return;


}






let min =

Math.floor(

remaining/60

);



let sec =

remaining%60;







timer.innerHTML =


`

${min<10?"0":""}${min}:

${sec<10?"0":""}${sec}

`;






progressBar.style.width =


(

remaining/HOLD_TIME*100

)

+"%";






},1000);



}









// =========================================
// END HOLD
// =========================================


function endHold(){



holdActive=false;



sessionSpins=0;



spinBtn.disabled=false;




holdOverlay.style.display="none";



ice.style.display="none";



machine.classList.remove(
"frozen"
);



removeSnow();



tone(
300,
.3,
"sine"
);



localStorage.removeItem(

"FrozenHoldEnd"

);



saveGame();



message.innerHTML=

"🎰 READY";



}








// =========================================
// RESTORE HOLD AFTER REFRESH
// =========================================


function restoreHold(){



let saved =

localStorage.getItem(

"FrozenHoldEnd"

);





if(!saved)

return;





let end =

Number(saved);





if(end>Date.now()){



holdActive=true;



spinBtn.disabled=true;



holdOverlay.style.display="flex";



ice.style.display="block";



machine.classList.add(
"frozen"
);



createSnow();



runHoldTimer(end);



}

else{


localStorage.removeItem(

"FrozenHoldEnd"

);



}



}









// =========================================
// ANTICIPATION EFFECT
// =========================================


function anticipation(){



let last =

slots[2];



last.classList.add(

"lastReelFire"

);



message.innerHTML=

"🔥 ONE MORE SYMBOL...";






setTimeout(()=>{



last.classList.remove(

"lastReelFire"

);



},3500);



}








// =========================================
// NEAR MISS EFFECT
// =========================================


function nearMiss(){



machine.classList.add(

"shake"

);



setTimeout(()=>{



machine.classList.remove(

"shake"

);



},400);



}









// =========================================
// FESTIVAL MODE
// =========================================


function activateFestival(){



document.body.classList.add(

"partyMode"

);



setTimeout(()=>{


document.body.classList.remove(

"partyMode"

);



},6000);



}









// =========================================
// JACKPOT COMPLETE
// =========================================


function completeGame(){



spinBtn.disabled=true;



slots[0].innerHTML="💰";

slots[1].innerHTML="⭐";

slots[2].innerHTML="💎";



message.innerHTML=

"🎉 JACKPOT 🎉";




jackpotSound();



activateFestival();



if(navigator.vibrate){



navigator.vibrate(

[100,50,200,50,400]

);



}







final.classList.add(
"show"
);



final.innerHTML=

`

<h2>

🎰 JACKPOT COMPLETE 🎰

</h2>


<br>


The reward appeared after uncertainty.


<br><br>


Every spin created anticipation.


<br><br>


The possibility kept attention.


<br><br>


<b>

Variable ratio reinforcement.

</b>


`;



}









// =========================================
// INITIALIZE
// =========================================


loadGame();


restoreHold();



</script>

     КОПИРАЙ СЛЕД PART 5
========================================= -->


<script>


// =========================================
// FINAL PATCHES
// свързва всички ефекти
// =========================================





// =========================================
// REALISTIC REEL BLUR IMPROVEMENT
// =========================================


function addReelBlur(){


slots.forEach(slot=>{


slot.classList.add(
"spinning"
);


});



}




function removeReelBlur(){


slots.forEach(slot=>{


slot.classList.remove(
"spinning"
);


});



}








// =========================================
// ENHANCED SPIN OVERRIDE
// заменя стария spin engine
// =========================================



const oldStartSpin = startSpin;



startSpin=function(){



if(spinning)

return;




spinning=true;



totalSpins++;

sessionSpins++;



updateCounter();

saveGame();




spinSound();


phoneVibrate();




// добавяме blur


addReelBlur();





let stopDelay=900;






slots.forEach((slot,index)=>{



setTimeout(()=>{



slot.classList.remove(
"spinning"
);



slot.classList.add(
"stopGlow"
);



slot.innerHTML=

symbols[

Math.floor(

Math.random()*symbols.length

)

];




reelStopSound();





setTimeout(()=>{


slot.classList.remove(
"stopGlow"
);



},700);







},stopDelay+(index*550));



});








setTimeout(()=>{


removeReelBlur();



finishSpin();



spinning=false;



},2800);





};









// =========================================
// EVERY 5 SPINS ANTICIPATION
// =========================================



function fiveSpinEffect(){



if(totalSpins%5!==0)

return;




let reel = slots[2];



reel.classList.add(
"lastReelFire"
);



message.innerHTML=

"🔥 JACKPOT IS CLOSE...";





setTimeout(()=>{


reel.classList.remove(
"lastReelFire"
);



},4000);



}








// patch finish spin


const oldFinishSpin = finishSpin;



finishSpin=function(){



oldFinishSpin();



fiveSpinEffect();



};









// =========================================
// HOLD FREEZE SOUND PATCH
// =========================================


const oldFreezeHold = startHold;



startHold=function(){



oldFreezeHold();



freezeSound();



};








// =========================================
// MOBILE ORIENTATION LOCK
// =========================================


function mobileOrientation(){



if(window.innerWidth >

window.innerHeight){



document.body.style.transform=

"rotate(0deg)";



}



}



window.addEventListener(

"resize",

mobileOrientation

);



mobileOrientation();









// =========================================
// AUTO SAVE BEFORE EXIT
// =========================================


window.addEventListener(

"beforeunload",

()=>{


saveGame();


}

);








// =========================================
// DEBUG MODE OFF
// =========================================


// готово
// Frozen Jackpot Final Build


</script>
